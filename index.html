<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0c0c1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">

<title>三語句型積木</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c1a;--surface:#151528;--card:#1c1c35;--border:#2a2a4a;--text:#e8e6f0;--dim:#8888aa;--jp:#ff6b6b;--en:#4ecdc4;--gold:#ffd700;--cn:#ffa94d}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);-webkit-user-select:text;user-select:text}
.header{padding:10px 14px 6px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.logo{font-size:1rem;font-weight:900;background:linear-gradient(135deg,var(--jp),var(--en));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sw,.lt{display:flex;background:var(--surface);border-radius:18px;border:1px solid var(--border);overflow:hidden}
.ub,.lb{padding:4px 10px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:.72rem;font-weight:700;cursor:pointer}
.ub.a{background:rgba(255,215,0,.1);color:var(--gold)}.lt{margin-left:auto}
.hn{display:flex;align-items:center;gap:4px;margin:0 auto}
.nb{width:28px;height:28px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center}.nb:disabled{opacity:.3}
.nc{font-size:.72rem;color:var(--dim);min-width:40px;text-align:center;background:transparent;border:1px solid transparent;border-radius:6px;font-family:inherit;padding:2px 4px;cursor:pointer}.nc:focus{border-color:rgba(255,215,0,.4);color:#ffd700;outline:none}
.lb.a-jp{background:rgba(255,107,107,.12);color:var(--jp)}.lb.a-en{background:rgba(78,205,196,.12);color:var(--en)}.lb.a-vs{background:rgba(255,215,0,.1);color:var(--gold)}
.badge{padding:2px 7px;border-radius:9px;font-size:.58rem}.sb{background:var(--surface);border:1px solid var(--border);color:var(--dim)}.pb{background:rgba(80,200,120,.1);border:1px solid rgba(80,200,120,.3);color:#50c878}
.dt{display:flex;gap:3px;padding:5px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.03);position:sticky;top:0;z-index:90;background:#0c0c1a}.dt::-webkit-scrollbar{display:none}
.tab{padding:3px 9px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--dim);font-family:inherit;font-size:.62rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}.tab.a{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.08)}
.mc{margin:10px;border-radius:14px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.mc.m-jp{border-color:rgba(255,107,107,.3)}.mc.m-en{border-color:rgba(78,205,196,.3)}.mc.m-vs{border-color:rgba(255,215,0,.3)}
.ca{padding:14px 18px 6px;text-align:center}.cs{font-size:1.5rem;font-weight:900;color:var(--cn)}.cd{font-size:.72rem;color:var(--dim);margin-top:3px}
.kt{margin-top:5px;padding:4px 12px;border:1px solid rgba(255,215,0,.3);border-radius:14px;background:rgba(255,215,0,.08);color:var(--gold);font-family:inherit;font-size:.68rem;font-weight:700;cursor:pointer}
.ba{padding:5px 14px 14px;min-height:70px}.br{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:5px 0;animation:fu .3s ease}
.bk{padding:8px 14px;border-radius:10px;font-weight:700;font-size:1.05rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}.bk:hover{transform:translateY(-2px)}
.bk-r{font-size:.55rem;opacity:.45;font-weight:400}
ruby{ruby-align:center}ruby rt{font-size:.5rem;font-weight:400;opacity:.6;color:#ffc0c0}
.bk-jp ruby rt{visibility:visible}.bk-en ruby rt{visibility:hidden}
.block-row-jp .bk{padding-top:18px}
.br{min-height:60px}
.bk-jp{background:rgba(255,107,107,.1);border:1.5px solid rgba(255,107,107,.3);color:#ffb4b4}
.bk-en{background:rgba(78,205,196,.1);border:1.5px solid rgba(78,205,196,.3);color:#a8ece8}
.r-主角{border-left:3px solid #ff6b6b}.r-動作{border-left:3px solid #4ecdc4}.r-對象{border-left:3px solid #ffd93d}.r-修飾{border-left:3px solid #a78bfa}.r-連接{border-left:3px solid #888}.r-場景{border-left:3px solid #66bb6a}.r-目標{border-left:3px solid #ff9800}.r-時間{border-left:3px solid #42a5f5}.r-語氣{border-left:3px solid #ef5350}
.fm{text-align:center;padding:2px 10px 6px;font-size:.78rem;color:var(--dim);font-family:monospace}
.sf{border:1px solid var(--border);background:var(--surface);color:var(--dim);font-family:inherit;font-size:.75rem;padding:4px 12px;border-radius:9px;cursor:pointer}
.xtbox{margin:6px auto 8px;max-width:90%;padding:8px 12px;background:rgba(196,181,253,.06);border:1px dashed rgba(196,181,253,.25);border-radius:8px;font-size:.78rem;color:#e0d4ff;text-align:center;font-weight:600;line-height:1.6}
.xtbox .xtlbl{font-size:.55rem;color:rgba(196,181,253,.7);margin-bottom:3px;font-weight:500;letter-spacing:0.5px}
.lit-tag{display:inline-block;padding:0 5px;margin:0 1px;border:1px solid;border-radius:4px;cursor:pointer;font-size:.72rem;font-weight:700;transition:transform .1s}
.lit-anno{display:inline-block;font-size:.62rem;color:#94a3b8;font-weight:400;font-style:italic;margin:0 2px;opacity:.85;background:rgba(148,163,184,.08);padding:1px 5px;border-radius:8px;letter-spacing:0.3px}
.lit-tag:hover{transform:scale(1.1)}
.lit-tag:active{transform:scale(.95)}
#tag-mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.tag-pop{background:#1a1a35;border:2px solid #c4b5fd;border-radius:16px;padding:18px 22px;max-width:380px;width:100%;color:#fff;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.tag-pop-close{position:absolute;top:8px;right:12px;background:none;border:none;color:#aaa;font-size:1.5rem;cursor:pointer;line-height:1}
.tag-pop-close:hover{color:#fff}
.tag-pop-tag{font-size:2rem;font-weight:900;text-align:center;margin-bottom:10px;line-height:1}
.tag-pop-jp{font-size:.95rem;color:#c4b5fd;text-align:center;margin-bottom:8px}
.tag-pop-jp b{color:#ffd700;font-size:1.1rem}
.tag-pop-mean{font-size:1rem;color:#e0d4ff;text-align:center;font-weight:600;margin-bottom:10px;background:rgba(196,181,253,.1);padding:8px 12px;border-radius:8px}
.tag-pop-ex{font-size:.8rem;color:#ffd700;text-align:center;margin:10px 0;font-style:italic}
.tag-pop-hint{font-size:.85rem;color:#94a3b8;text-align:center;margin-top:10px;padding-top:10px;border-top:1px dashed rgba(196,181,253,.2)}
.tag-pop-order{margin-top:12px;padding:10px 12px;background:linear-gradient(135deg,rgba(125,211,252,.08),rgba(196,181,253,.08));border:1px solid rgba(125,211,252,.25);border-radius:10px}
.tag-pop-compress{margin-top:12px;padding:10px 12px;background:linear-gradient(135deg,rgba(251,146,60,.08),rgba(244,114,182,.08));border:1px solid rgba(251,146,60,.3);border-radius:10px}
.comp-title{font-size:.78rem;font-weight:700;color:#fb923c;margin-bottom:8px;letter-spacing:0.5px}
.comp-body{font-size:.8rem;color:#e0d4ff;line-height:1.6;margin-bottom:8px}
.comp-rule{font-size:.74rem;color:#86efac;background:rgba(134,239,172,.08);border-left:3px solid #86efac;padding:6px 10px;border-radius:4px;line-height:1.5;text-align:center}
.ord-title{font-size:.78rem;font-weight:700;color:#7dd3fc;margin-bottom:6px;letter-spacing:0.5px}
.ord-body{font-size:.78rem;color:#e0d4ff;line-height:1.5;margin-bottom:8px}
.ord-rules{font-size:.75rem;color:#fbbf24;background:rgba(251,191,36,.08);border-left:3px solid #fbbf24;padding:6px 10px;border-radius:4px;line-height:1.55;margin-bottom:8px}
.ord-emphasis{font-size:.78rem;color:#86efac;text-align:center;font-weight:700;margin-top:4px}
/* 不規則動詞透視鏡 popup */
.bk-irr{position:absolute;top:-6px;right:-6px;background:#ff6b6b;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.6rem;cursor:pointer;z-index:5;border:2px solid var(--bg);box-shadow:0 0 0 1px #ff6b6b}
.bk-end{position:absolute;top:-6px;left:-6px;background:#60a5fa;color:#fff;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:.55rem;cursor:pointer;z-index:5;border:2px solid var(--bg);box-shadow:0 0 0 1px #60a5fa}
.bk-end:hover{transform:scale(1.15)}
.bk-irr:hover{transform:scale(1.15)}
.bk{position:relative}
#irr-mask{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:99999;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.irr-pop{background:#1a1a35;border:2px solid #ffd700;border-radius:16px;padding:18px 22px;max-width:480px;width:100%;color:#fff;position:relative;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.irr-close{position:absolute;top:8px;right:12px;background:none;border:none;color:#aaa;font-size:1.5rem;cursor:pointer;line-height:1}
.irr-close:hover{color:#fff}
.irr-title{font-size:.85rem;font-weight:700;color:#ffd700;margin-bottom:10px;text-align:center}
.irr-name{font-size:1.1rem;font-weight:700;color:#ff9bd0;text-align:center;margin-bottom:4px}
.irr-hint{font-size:.7rem;color:#c4b5fd;text-align:center;margin-bottom:6px}
.irr-warn{background:rgba(255,107,107,.15);border-left:3px solid #ff6b6b;padding:6px 10px;font-size:.75rem;color:#ffb3b3;margin:10px 0;border-radius:4px}
.ve-scene,.ve-inner,.ve-effect{font-size:.78rem;color:#e0d4ff;margin:8px 0;padding:8px 12px;border-radius:8px;line-height:1.6;border-left:3px solid}
.ve-scene{background:rgba(125,211,252,.08);border-left-color:#7dd3fc}
.ve-inner{background:rgba(196,181,253,.08);border-left-color:#c4b5fd}
.ve-effect{background:rgba(134,239,172,.08);border-left-color:#86efac}
.ve-h{font-size:.6rem;color:#94a3b8;font-weight:700;letter-spacing:0.5px;margin-bottom:3px;text-transform:uppercase}
.irr-forms{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.irr-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(255,255,255,.04);border-radius:8px;font-size:.8rem;flex-wrap:wrap}
.irr-row.irr-current{background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.4)}
.irr-label{color:#888;font-size:.7rem;min-width:60px;font-weight:600}
.irr-form{color:#ffd700;font-weight:700;cursor:pointer;padding:2px 6px;border-radius:4px;background:rgba(255,215,0,.06)}
.irr-form:hover{background:rgba(255,215,0,.18)}
.irr-read{color:#aaa;font-size:.75rem}
.irr-here{color:#ff9bd0;font-size:.7rem;font-weight:700;margin-left:auto}
.vc{display:grid;grid-template-columns:1fr 1fr}.vs{padding:8px 10px}.vs.js{border-right:1px solid var(--border)}
.vl{font-size:.62rem;font-weight:900;margin-bottom:5px;text-align:center}.vl.jp{color:var(--jp)}.vl.en{color:var(--en)}
.vb{padding:2px 5px;border-radius:4px;font-size:.68rem;display:flex;justify-content:space-between;margin:2px 0}.vb.jp{background:rgba(255,107,107,.07);color:#ffb4b4}.vb.en{background:rgba(78,205,196,.07);color:#a8ece8}.vt{font-size:.48rem;opacity:.35}
.cb{margin:0 14px 10px;padding:10px 14px;border-radius:9px;background:var(--surface);border:1px solid var(--border);font-size:.82rem;line-height:1.7;color:var(--dim)}.cl{font-weight:700;margin-right:3px}
.nr{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-top:1px solid var(--border)}
.nb{width:30px;height:30px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center}.nb:disabled{opacity:.3}
.nc{font-size:.68rem;color:var(--dim);min-width:45px;text-align:center;background:transparent;border:1px solid transparent;border-radius:6px;font-family:inherit;padding:2px 4px}.nc:focus{border-color:rgba(255,215,0,.4);color:#ffd700;outline:none}
.dr{display:flex;gap:2px;justify-content:center;padding:0 14px 10px;flex-wrap:wrap}
.d{width:5px;height:5px;border-radius:50%;background:var(--border);cursor:pointer}.d.a-jp{background:var(--jp)}.d.a-en{background:var(--en)}.d.a-vs{background:var(--gold)}.d.sn{background:rgba(80,200,120,.5)}
.lg{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 7px;justify-content:center}.li{display:flex;align-items:center;gap:2px;font-size:.48rem;color:var(--dim)}.ld{width:4px;height:4px;border-radius:2px}
.ko{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}.ko.op{opacity:1;pointer-events:auto}
.kp{background:#1a1a35;border-radius:18px;max-width:380px;width:90%;box-shadow:0 16px 50px rgba(0,0,0,.5);overflow:hidden;border:2px solid rgba(255,255,255,.08);transform:scale(.8);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}.ko.op .kp{transform:scale(1)}
.kh{padding:14px 18px 6px;text-align:center}.ms{font-size:2rem;display:block;margin-bottom:2px}.pt{font-size:.72rem;font-weight:900;color:var(--gold)}.mt{font-size:1rem;font-weight:900;margin-top:3px;line-height:1.3}.mt.jt{color:#ff8a8a}.mt.et{color:#7eeae0}
.bs{margin:0 12px 5px;padding:8px 12px;border-radius:10px;font-size:.78rem;line-height:1.7;font-weight:700}
.bc{background:rgba(255,169,77,.1);border:1px solid rgba(255,169,77,.2);color:#ffcc88}
.bj{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.2);color:#ffb4b4}
.be{background:rgba(78,205,196,.1);border:1px solid rgba(78,205,196,.2);color:#a8ece8}
.bf{font-size:.62rem;display:block;margin-bottom:2px;opacity:.55}
.mi{margin:5px 12px 10px;padding:7px 12px;border-radius:10px;background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(255,169,77,.07));border:1px solid rgba(255,215,0,.2);text-align:center;font-size:.78rem;font-weight:900;color:var(--gold)}
.kc{margin:0 12px 12px;padding:7px;border:none;border-radius:10px;background:rgba(255,255,255,.05);color:var(--dim);font-family:inherit;font-size:.72rem;font-weight:700;width:calc(100% - 24px);cursor:pointer}.kc:hover{background:rgba(255,255,255,.1);color:#fff}
.ld-c{display:flex;align-items:center;justify-content:center;height:50vh;flex-direction:column;gap:8px}.ld-t{color:var(--dim);font-size:.78rem}
.sp{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.ko.op .ms{animation:bn 1s ease-in-out .3s}
.ki{margin:0 12px 12px;border-radius:14px;background:#1a1a35;border:1.5px solid rgba(255,215,0,.12);overflow:hidden;animation:fu .3s ease;position:relative}
.ki-h{padding:10px 14px 4px;display:flex;align-items:center;justify-content:center;gap:6px}
.ki-ms{font-size:1.6rem}.ki-tt{font-size:.78rem;font-weight:900;color:var(--gold)}
.ki-mt{text-align:center;padding:0 14px 6px;font-size:1.05rem;font-weight:900;line-height:1.3}
.ki-mt.jt{color:#ff8a8a}.ki-mt.et{color:#7eeae0}
.ki-b{margin:0 10px 5px;padding:8px 12px;border-radius:9px;font-size:.85rem;line-height:1.7;font-weight:700}
.ki-cn{background:rgba(255,169,77,.07);border:1px solid rgba(255,169,77,.12);color:#ffcc88}
.ki-jp{background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.12);color:#ffb4b4}
.ki-en{background:rgba(78,205,196,.07);border:1px solid rgba(78,205,196,.12);color:#a8ece8}
.ki-fl{font-size:.58rem;display:block;margin-bottom:2px;opacity:.5}
.ki-tp{margin:3px 10px 10px;padding:6px 12px;border-radius:9px;background:linear-gradient(135deg,rgba(255,215,0,.07),rgba(255,169,77,.04));border:1px solid rgba(255,215,0,.12);text-align:center;font-size:.85rem;font-weight:900;color:var(--gold)}
.diy{margin:0 12px 12px;border-radius:14px;background:#1a1a35;border:1.5px solid rgba(255,215,0,.12);overflow:hidden;padding:10px 14px}
.diy-h{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px}
.diy-h span:first-child{font-size:1.1rem}.diy-h span:last-child{font-size:.75rem;font-weight:900;color:#ffd700}
.diy-input{display:flex;gap:6px;margin-bottom:8px}
.diy-input input{flex:1;padding:8px 12px;border-radius:9px;border:1.5px solid rgba(255,215,0,.2);background:rgba(255,255,255,.05);color:#fff;font-size:.85rem;font-family:inherit}
.diy-input input::placeholder{color:rgba(255,255,255,.3)}
.diy-input input:focus{outline:none;border-color:rgba(255,215,0,.5)}
.diy-btn{padding:8px 16px;border-radius:9px;border:none;font-weight:900;font-size:.78rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.diy-btn.go{background:linear-gradient(135deg,#ffd700,#ff9800);color:#1a1a2e}
.diy-btn.go:disabled{opacity:.4;cursor:not-allowed}
.diy-btn.del{background:rgba(255,80,80,.15);color:#ff8888;border:1px solid rgba(255,80,80,.2);padding:4px 10px;font-size:.68rem}
.diy-result{padding:8px 12px;border-radius:9px;font-size:.85rem;line-height:1.7;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.diy-result.jp{background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.12);color:#ffb4b4}
.diy-result.en{background:rgba(78,205,196,.07);border:1px solid rgba(78,205,196,.12);color:#a8ece8}
.diy-result .diy-text{flex:1}
.diy-result .diy-speak{cursor:pointer;font-size:1.1rem;opacity:.7;flex-shrink:0}.diy-result .diy-speak:hover{opacity:1}
.diy-saved{margin-top:6px;border-top:1px solid rgba(255,255,255,.06);padding-top:8px}
.diy-saved-h{font-size:.62rem;color:rgba(255,255,255,.3);margin-bottom:4px}
.diy-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.diy-item .diy-speak{cursor:pointer;font-size:.95rem;opacity:.6;flex-shrink:0}.diy-item .diy-speak:hover{opacity:1}
.diy-item .diy-body{flex:1;min-width:0}
.diy-item .diy-tr{font-size:.82rem;font-weight:700;line-height:1.8}
.diy-item .diy-tr.jp{color:#ffb4b4}.diy-item .diy-tr.en{color:#a8ece8}
.diy-item .diy-tr ruby rt{font-size:.48rem;font-weight:400;opacity:.55;color:#ffc0c0}
.diy-item .diy-cn{font-size:.62rem;color:rgba(255,255,255,.3);margin-top:1px}
.diy-loading{text-align:center;padding:12px;font-size:.75rem;color:rgba(255,215,0,.6)}
.diy-loading::after{content:'';display:inline-block;width:12px;height:12px;border:2px solid rgba(255,215,0,.3);border-top-color:#ffd700;border-radius:50%;animation:spin .6s linear infinite;margin-left:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.gear-icon{padding:3px 8px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--dim);font-size:.68rem;cursor:pointer;font-family:inherit;white-space:nowrap}

function showTagPopup(tag,evt){
if(evt){evt.stopPropagation();}
const info=TAG_INFO[tag];
let html='<div class="tag-pop"><button class="tag-pop-close" onclick="closeTagPopup()">×</button>';
html+='<div class="tag-pop-tag" style="color:'+(info?info.color:'#fff')+'">['+tag+']</div>';
if(info){
if(info.jp)html+='<div class="tag-pop-jp">日文：<b>'+info.jp+'</b></div>';
html+='<div class="tag-pop-mean">意思：'+info.mean+'</div>';
if(info.ex)html+='<div class="tag-pop-ex">範例：'+info.ex+'</div>';
html+='<div class="tag-pop-hint">'+info.hint+'</div>';
/* === 壓縮 vs 展開（日文一個字 = 中文一對連接詞） === */
if(info.compress){
html+='<div class="tag-pop-compress">';
html+='<div class="comp-title">🇯🇵壓縮 vs 🇹🇼展開</div>';
html+='<div class="comp-body">'+info.compress+'</div>';
html+='<div class="comp-rule">💡 日文用「<b>1 個</b>句尾字」<br>= 中文用「<b>2 個</b>對偶連接詞」</div>';
html+='</div>';}
/* === 語序自由度提示（針對真正的助詞） === */
if(info.particle){
html+='<div class="tag-pop-order">';
html+='<div class="ord-title">🔀 語序自由度</div>';
html+='<div class="ord-body">'+(info.orderHint||'這個助詞像「貼紙」黏著前面的字。順序可以重新排，意思不變。')+'</div>';
html+='<div class="ord-rules"><b>🚨 但有 2 個鐵則：</b><br>① 動詞永遠在最後<br>② 助詞要黏著它的字，不能分開</div>';
html+='<div class="ord-emphasis">💡 越前面 = 越強調</div>';
html+='</div>';}
}else{html+='<div class="tag-pop-mean">（這個標籤還沒收錄說明，請告訴 Claude 補上）</div>';}

let mask=document.getElementById('tag-mask');
if(!mask){mask=document.createElement('div');mask.id='tag-mask';mask.onclick=function(e){if(e.target===mask)closeTagPopup();};document.body.appendChild(mask);}
mask.innerHTML=html;mask.style.display='flex';}

function renderLiteralWithTags(text){
/* Process (annotation) FIRST via placeholders to avoid conflict with onclick="...('x',event)" */
let out=text.replace(/\(([^)（）]+)\)/g,'\u0001ANNO\u0001$1\u0001ENDA\u0001');
out=out.replace(/\[([^\]]+)\]/g,function(m,tag){
const info=TAG_INFO[tag];
const color=info?info.color:'#c4b5fd';
const display=TAG_TO_JP_EMOJI[tag]||tag;
return '<span class="lit-tag" style="background:'+color+'33;border-color:'+color+'66;color:'+color+'" onclick="showTagPopup(\''+tag.replace(/'/g,"\\'")+'\',event)">['+display+']</span>';});
/* Now replace placeholders with anno spans */
out=out.replace(/\u0001ANNO\u0001([\s\S]*?)\u0001ENDA\u0001/g,'<span class="lit-anno">$1</span>');
return out;}

'なかった':{name:'なかった (過去沒做 / 朋友間)',scene:'😊 對朋友說「昨天沒做」「以前沒做」',inner:'「沒做 + 過去」',effect:'回想以前**沒做**的事情',examples:[{form:'食べなかった',read:'たべなかった',meaning:'沒吃'},{form:'来なかった',read:'こなかった',meaning:'沒來'},{form:'行かなかった',read:'いかなかった',meaning:'沒去'}],warn:'⚠️ 對長輩 → 改用「食べませんでした」'},
'た':{name:'た (過去 / 朋友間)',scene:'😊 對朋友說「做過了」「已經做了」',inner:'最基本的「做了」',effect:'**確認已經完成**、自然的講話',examples:[{form:'食べた',read:'たべた',meaning:'吃了'},{form:'買った',read:'かった',meaning:'買了'},{form:'見た',read:'みた',meaning:'看了'}],warn:'⚠️ 對長輩 → 改用「食べました」'},
'て':{name:'て (連接 / 順序動作)',scene:'🔗 一句話裡有「先做A 然後B」、或請求對方',inner:'動作的連接器',effect:'**把兩個動作串起來**，例：「起床、洗臉、吃飯」',examples:[{form:'食べて',read:'たべて',meaning:'吃了然後...'},{form:'起きて',read:'おきて',meaning:'起床然後...'},{form:'見て',read:'みて',meaning:'看一下！'}],warn:'⚠️ 「て」結尾單獨用 = 輕鬆地請求「幫我看一下」'},
'ている':{name:'ている / ています (て + いる = 持續/狀態)',scene:'⏱️ 兩種場合：① 此刻正在做 ② 已經完成且持續中',inner:'⚠️ 重要！這是<b>「て + いる」兩個東西</b>合起來的句型，不是單一尾巴！<br><br>📐 完整公式：<br>動詞て形 + いる = 「正在做」或「狀態持續」',effect:'🎯 為什麼一定要加「いる」？<br>因為「て」只是動作的連接點，沒有「持續」的語感！<br>加上「いる」（存在）= 「做了的狀態還存在著」<br>= 中文的「正在...」或「...著」<br><br>📋 拆解範例（例句 135 ニコニコしている）：<br>① ニコニコ（擬聲詞）<br>② + する → 變動詞<br>③ する → して（て形）= 笑了 / 笑著（連接點）<br>④ して + <u>いる</u> = 笑著的<b>狀態持續</b><br>→「笑嘻嘻的」<br><br>📢 講出口的效果：<br>說 <b>して</b> = 「笑了，然後...」（話沒講完）<br>說 <b>している</b> = 「笑咪咪著」（完整句）<br>說 <b>しています</b> = 「笑咪咪著」（禮貌版）<br><br>🦎 ている vs ています：<br>🇯🇵 ている = 普通版（朋友）<br>🇯🇵 ています = 禮貌版（長輩/客戶）',examples:[{form:'している',read:'している',meaning:'做著（普通）'},{form:'しています',read:'しています',meaning:'做著（禮貌）'},{form:'ニコニコしている',read:'にこにこしている',meaning:'笑咪咪著'},{form:'食べている',read:'たべている',meaning:'正在吃'},{form:'結婚しています',read:'けっこんしています',meaning:'結婚著（已婚的狀態）'},{form:'知っています',read:'しっています',meaning:'知道（這狀態還持續）'}],warn:'⚠️ 「ている」是「て + いる」兩個東西組起來的！不是單一尾巴。<br>⚠️ 「結婚しています」不是「正在結婚」是「已婚」！這是「狀態」用法'},
'ていた':{name:'ていた / ていました (那時候正在做)',scene:'⏪ 回憶過去某時間點「那時候在做」',inner:'過去某瞬間的進行狀態',effect:'**畫面停在過去某個正在做的瞬間**',examples:[{form:'食べていた',read:'たべていた',meaning:'(那時)正在吃（普通）'},{form:'食べていました',read:'たべていました',meaning:'(那時)正在吃（禮貌）'},{form:'雨が降っていました',read:'あめがふっていました',meaning:'(那時)正在下雨'}],warn:'⚠️ 「食べた」=已經吃完了；「食べていた」=那當下正在吃'},
'たい':{name:'たい (我想做)',scene:'💭 表達「自己的願望」',inner:'「想要做...」',effect:'**只能用於自己**（不能用 たい 描述別人想做什麼）',examples:[{form:'食べたい',read:'たべたい',meaning:'我想吃'},{form:'行きたい',read:'いきたい',meaning:'我想去'},{form:'寝たい',read:'ねたい',meaning:'我想睡'}],warn:'⚠️ 描述別人想做 → 用「行きたがる」'},
'たかった':{name:'たかった (那時想做)',scene:'💭 回想以前「曾經很想做」',inner:'「想做 + 過去」= 那時想做',effect:'**通常帶有遺憾**（沒做成、現在想想覺得當時想做）',examples:[{form:'食べたかった',read:'たべたかった',meaning:'(那時)想吃'},{form:'行きたかった',read:'いきたかった',meaning:'(那時)想去'}],warn:'⚠️ 常見搭配「行きたかったけど、…」=當時想去但...'},
'ましょう':{name:'ましょう (一起做吧！)',scene:'👥 邀請對方「我們一起做某事」',inner:'「禮貌的邀請」',effect:'**主動發起共同行動**、語氣積極又有禮貌',examples:[{form:'食べましょう',read:'たべましょう',meaning:'一起吃吧'},{form:'行きましょう',read:'いきましょう',meaning:'一起去吧'},{form:'始めましょう',read:'はじめましょう',meaning:'我們開始吧'}],warn:'⚠️ 比「食べよう」更禮貌、適合對不熟的人說'},
'れる':{name:'れる (被…/能…)',scene:'🎬 兩種：① 「被別人做」 ② 「能夠做」',inner:'被動或可能',effect:'① 被罵了→怒られる ② 會說中文→話せる<br>**第一類動詞用這個**',examples:[{form:'読まれる',read:'よまれる',meaning:'被讀'},{form:'怒られる',read:'おこられる',meaning:'被罵'},{form:'行ける',read:'いける',meaning:'能去'},{form:'話せる',read:'はなせる',meaning:'能說'}],warn:'⚠️ 「被」常常是不爽的事；「能」則是好事。看上下文判斷'},
'られる':{name:'られる (被…/能…/(尊敬))',scene:'🎬 三種：① 被…  ② 能… ③ 尊敬語',inner:'被動 / 可能 / 尊敬',effect:'① 被吃 ② 能吃 ③ 對方「吃」的尊敬版<br>**第二類動詞用這個**',examples:[{form:'食べられる',read:'たべられる',meaning:'被吃 / 能吃'},{form:'見られる',read:'みられる',meaning:'被看 / 能看'},{form:'来られる',read:'こられる',meaning:'能來 / (尊敬)來'}],warn:'⚠️ 一個字三種意思，要看上下文判斷'},
'させる':{name:'させる (讓別人做)',scene:'👨‍🏫 強迫或允許別人做某事',inner:'「使役」= 我讓他做',effect:'**主導者是我，動作是別人做**<br>例：老師讓學生背書、媽媽讓小孩吃菜',examples:[{form:'食べさせる',read:'たべさせる',meaning:'讓...吃'},{form:'行かせる',read:'いかせる',meaning:'讓...去'},{form:'勉強させる',read:'べんきょうさせる',meaning:'讓...念書'}],warn:'⚠️ 上對下使用，例：父母→小孩、老闆→員工'},
'させられる':{name:'させられる (被迫做)',scene:'😩 被別人強迫做不想做的事',inner:'「使役 + 被動」= 被迫做',effect:'**強烈的負面情緒**、抱怨語氣<br>例：被媽媽逼著吃青菜',examples:[{form:'食べさせられる',read:'たべさせられる',meaning:'被迫吃'},{form:'勉強させられる',read:'べんきょうさせられる',meaning:'被迫念書'}],warn:'⚠️ 這是日文中表達「不爽被迫做」的標準說法'},
'てください':{name:'てください (請…)',scene:'🙏 禮貌地請別人做某事',inner:'「請求 + 禮貌」',effect:'**對方比較容易答應**、不會覺得被命令',examples:[{form:'食べてください',read:'たべてください',meaning:'請吃'},{form:'見てください',read:'みてください',meaning:'請看'},{form:'待ってください',read:'まってください',meaning:'請等等'}],warn:'⚠️ 朋友間 → 用「食べて」就好（去掉ください）'},
'ないで':{name:'ないで (請別…)',scene:'🚫 禮貌地請對方「不要做」',inner:'「請求別做 + 柔和」',effect:'**柔和地阻止**對方，比直接命令好聽很多',examples:[{form:'食べないで',read:'たべないで',meaning:'別吃'},{form:'来ないで',read:'こないで',meaning:'別來'},{form:'泣かないで',read:'なかないで',meaning:'別哭'}],warn:'⚠️ 加 ください 更禮貌：「食べないでください」'},
'い形':{name:'〜い (い形容詞 原形)',scene:'😊 跟朋友、家人形容某個東西',inner:'這是<b>い形容詞</b>的原形（字典形），<br>結尾是「い」。',effect:'這個形容詞還沒變身！<br><br>🎯 在這句裡的角色：<br>i形容詞可以「直接修飾名詞」（不用 の）<br>赤い車 = 紅色的車<br>安い店 = 便宜的店<br><br>🦎 變身規則（變過去/否定時要先「切い」）：<br>① 過去式 → 切い + かった：安い → 安<u>かった</u><br>② 否定 → 切い + くない：安い → 安<u>くない</u><br>③ 禮貌 → 直接加 です：安い → 安<u>いです</u><br>④ 副詞化 → 切い + く：安い → 安<u>く</u>',examples:[{form:'安い',read:'やすい',meaning:'便宜的（原形）'},{form:'高い',read:'たかい',meaning:'貴的/高的（原形）'},{form:'寒い',read:'さむい',meaning:'冷的（原形）'},{form:'楽しい',read:'たのしい',meaning:'有趣的（原形）'},{form:'美味しい',read:'おいしい',meaning:'好吃的（原形）'}],warn:'⚠️ い形容詞 vs な形容詞：い形容詞結尾是「い」（安い、高い）；な形容詞結尾是「な」或「だ」（静かな、便利な）。變化方式不同！'},
'し形':{name:'〜しながら / 〜しました (擬聲詞 + する 變動詞)',scene:'🎵 想用擬聲詞/擬態詞當動作（如：興奮地、心跳地、笑著）',inner:'⚠️ 重要！<b>「し」是 する 的變身</b>，不是擬聲詞的一部分！<br><br>📐 完整公式：<br>擬聲詞 + する = 變成動詞',effect:'🎯 為什麼需要這個 し？<br>因為「ながら / ます / た」必須接<b>動詞連用形</b>，<br>而 ワクワク（擬聲詞）不是動詞！<br><br>所以日文母語者腦內：<br>① ワクワク（擬聲詞，不能直接接尾巴）<br>② ワクワク + する → 變成動詞「興奮著」<br>③ する 變連用形「し」→ ワクワクし<br>④ 接 ながら → <u>ワクワクしながら</u>（一邊興奮著）<br><br>🦎 する 變身規則：<br>する → <u>し</u>ます（禮貌）<br>する → <u>し</u>ながら（一邊...）<br>する → <u>し</u>ない（不做）<br>する → <u>し</u>た（做了）<br><br>📋 同類常用例子：<br>ドキドキ + する = 心跳加速<br>イライラ + する = 焦躁<br>ニコニコ + する = 笑咪咪<br>キラキラ + する = 閃閃發亮<br>勉強 + する = 讀書<br>運動 + する = 運動',examples:[{form:'ワクワクしながら',read:'わくわくしながら',meaning:'一邊興奮著'},{form:'ドキドキしながら',read:'どきどきしながら',meaning:'一邊心跳著'},{form:'勉強しながら',read:'べんきょうしながら',meaning:'一邊讀書著'},{form:'ニコニコしながら',read:'にこにこしながら',meaning:'一邊笑著'}],warn:'⚠️ 「し」是 する 的連用形變身，不是擬聲詞 ワクワク 的一部分！中文母語者最常搞混的點！'},
'いです':{name:'〜いです (い形容詞 + 禮貌)',scene:'🎓 對長輩/客戶/老師客氣地形容某個東西',inner:'這是<b>い形容詞 + です</b>（禮貌版）。<br>不是動詞！',effect:'🦎 い形容詞變禮貌很簡單：<br>直接在原形後面加「です」<br><br>例子拆解：<br>安い（便宜）→ 安い<u>です</u>（便宜，禮貌）<br>高い（貴）→ 高い<u>です</u>（貴，禮貌）<br><br>📢 講出口的效果：<br>說「安い」= 跟朋友說「便宜啦」（隨意）<br>說「安いです」= 跟老師說「便宜的」（禮貌）<br><br>⚠️ 注意：い形容詞跟な形容詞不一樣！<br>🇯🇵 安い+です ✅（い直接接です）<br>🇯🇵 静か+です ✅（な形容詞也加です）<br>🇯🇵 静かい+です ❌（不存在這種寫法）',examples:[{form:'安いです',read:'やすいです',meaning:'便宜的（禮貌）'},{form:'高いです',read:'たかいです',meaning:'貴的（禮貌）'},{form:'寒いです',read:'さむいです',meaning:'冷的（禮貌）'},{form:'美味しいです',read:'おいしいです',meaning:'好吃的（禮貌）'}],warn:'⚠️ 「いです」是「い形容詞 + 禮貌語尾」，不是動詞！整個尾巴的「です」是禮貌標記，不是 u-動詞的「す」結尾。'},
'u形':{name:'う / く / ぐ / す / つ / ぬ / ぶ / む (動詞辭書形)',scene:'😊 動詞最基本的樣子（字典裡查到的）',inner:'這是<b>第一類動詞（u-動詞）</b>的辭書形，<br>結尾是 u 段音（く / む / す / つ 等等）。',effect:'這個動詞還沒變身！是最原始的樣子。<br><br>🎯 在這句裡的角色：<br>「泣く」直接接後面的名詞，當「形容詞」用！<br>泣く + ほど = 「哭那種程度的」<br>就像 [✨修飾] 標籤的功能！<br><br>🦎 變身規則：<br>「く」段 → 變到 い 段（敬語）：泣く → 泣<u>き</u>ます<br>「く」段 → 變到 あ 段（否定）：泣く → 泣<u>か</u>ない<br>「く」段 → 變到 え 段（能力）：泣く → 泣<u>け</u>る',examples:[{form:'泣く',read:'なく',meaning:'哭（原形）'},{form:'書く',read:'かく',meaning:'寫（原形）'},{form:'読む',read:'よむ',meaning:'讀（原形）'},{form:'話す',read:'はなす',meaning:'說（原形）'},{form:'買う',read:'かう',meaning:'買（原形）'}],warn:'⚠️ 這個尾巴的「く / む / す」是動詞自己的尾巴，不是助詞！整個「泣く」是一個動詞單字。'},
'ば形':{name:'〜ば (條件形 / 假設)',scene:'🌧️ 想說「如果...的話」',inner:'這是動詞/形容詞的<b>條件形</b>，<br>表達「假設條件」（如果...）',effect:'🦎 變身規則：<br>① 字尾滑到 え 段<br>② 加「ば」<br><br>例子拆解：<br>勉強する → すれ + ば = <u>勉強すれば</u>（如果讀書）<br>食べる → 食べれ + ば = <u>食べれば</u>（如果吃）<br>行く → 行け + ば = <u>行けば</u>（如果去）<br>飲む → 飲め + ば = <u>飲めば</u>（如果喝）<br><br>📢 講出口的效果：<br>✅ 一般用途：表達「如果」（比 たら 正式）<br>✅ 特殊用途：跟「ほど」配合 → 「越...越...」<br>　例：勉強すればするほど = 越讀越',examples:[{form:'勉強すれば',read:'べんきょうすれば',meaning:'如果讀書'},{form:'食べれば',read:'たべれば',meaning:'如果吃'},{form:'行けば',read:'いけば',meaning:'如果去'},{form:'飲めば',read:'のめば',meaning:'如果喝'},{form:'安ければ',read:'やすければ',meaning:'如果便宜'}],warn:'⚠️ 「ば」是條件形尾巴，跟「ほど」一起用會變成「越...越...」！'},
'越':{name:'〜ば〜ほど (越...越... 複合句型)',scene:'📈 想說「越...越...」的效果',inner:'⚠️ 重要！「越來越」<b>不是一個日文字</b>，<br>是 3 個元素夾擊產生的<b>複合句型</b>！',effect:'📐 完整公式（3 件套）：<br>① 動詞 ば形（如果做）<br>② 同動詞 原形<br>③ ほど（程度標記）<br><br>例子拆解（例句 109）：<br>勉強<b>すれば</b>（如果讀）+ <b>する</b>（讀）+ <b>ほど</b>（程度）<br>= 越讀越...<br><br>📢 講出口的效果：<br>學生說「<b>勉強すればするほど</b>面白い」<br>= 自動產生「越學越有趣」的<b>中文語感</b><br><br>📋 更多例子：<br>食べ<b>れば</b>食べる<b>ほど</b>美味しい = 越吃越好吃<br>知<b>れば</b>知る<b>ほど</b>面白い = 越了解越有趣<br>高<b>ければ</b>高い<b>ほど</b>いい = 越貴越好',examples:[{form:'勉強すればするほど',read:'べんきょうすればするほど',meaning:'越讀越'},{form:'食べれば食べるほど',read:'たべればたべるほど',meaning:'越吃越'},{form:'知れば知るほど',read:'しればしるほど',meaning:'越了解越'}],warn:'⚠️ 學生最常犯：以為「越」對應某個日文字！其實是「ば+原形+ほど」三件套合力產生的效果。少一個元素就會失敗！'},

function xtFetchGemini(sentence,mode,apiKey){

('你是語言學「逐詞對譯」（Interlinear Glossing）專家。請把下面的英文句子，完全按照英文的語序，逐個詞翻譯成中文，**保留英文 SVO 語序**（主-動-受），但用中文單詞。這是給台灣小學生看的「英文大腦直譯」，目的是讓他們察覺英文與中文的語序差異（特別是時間、地點、修飾語的位置）。\n\n規則：\n1. **絕對不要改成自然中文語序**\n2. 用最簡單的中文單字\n3. 冠詞翻譯：a/an=[一]、the=[那]\n4. 介係詞保留位置：on=[在上面]、at=[在]、for=[為了/持續]、since=[從...以來]、to=[向]\n5. 時態保留：have done=「已經 做了」、had done=「曾經 做了」、will do=「將 做」、is doing=「正在 做」\n6. 用空格或斜線分隔詞語\n7. 只回答直譯結果，不加解釋、不加引號\n\n英文句子：'+sentence+'\n\n逐詞直譯：');

const raw=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('')||'';

function xrayParseGemini(s,apiKey){
const res=document.getElementById('xray-res');
res.innerHTML='<div class="diy-loading">🤖 AI 深度解析中</div>';
const prompt='你是專門教台灣小學生日文的文法X光機。請將以下日文句子拆解成「積木」。\n\n【嚴格切割規則】\n1. 每個名詞獨立一塊（「昨日友達」→「昨日」和「友達」兩塊）\n2. 助詞必須獨立一塊（は、が、を、に、で、と、から、まで、へ、も、の、よ、ね、か）\n3. 動詞/形容詞如果有變形，整個變形後的詞為一塊，但要標出原形和變形過程\n4. 複合表現如「ことにする」「なければならない」要保持完整\n5. 標點符號獨立一塊\n\n【type 分類】只能用以下值：\n- 名詞（一般名詞、專有名詞、代名詞、時間詞）\n- 助詞（は、が、を、に、で、と、の、から、まで、へ、も、よ、ね、か等）\n- 動詞變形（有活用變化的動詞）\n- い形容詞 / い形容詞變形\n- な形容詞\n- 副詞\n- 連體詞（この、その、あの等）\n- 接續詞（しかし、だから等）\n- 感動詞\n- 標點\n- 補助動詞（ている、てしまう、ことにする 等複合表現的輔助部分）\n\n【role 分類】用小學生懂的語言：\n主角、動作、對象、修飾、場景、目標、時間、起點、終點、語氣、連接、主題標記、陪伴、方向、所屬\n\n【助詞的 desc 說明】用生活化比喻：\nは=說到○○嘛… が=就是這個！ を=被處理的東西 に=往這裡去/在這裡 で=在這裡做/用這個做 と=跟誰一起/說什麼 から=從這裡開始 まで=到這裡為止 へ=朝那邊去 も=也是 の=誰的 よ=告知強調 ね=對吧？ か=嗎？\n\n【動詞 group 標記】\nG1 勤勞家族（五段）、G2 懶惰家族（砍る）、G3 例外（する/くる）、G3（する複合）\n\n請嚴格回覆純 JSON 陣列，不加 markdown 標記、不加```、不加解釋：\n[{"text":"詞","type":"分類","role":"角色","desc":"說明","orig":"原形或null","form":"變形過程或null","meaning":"變形意思或null","group":"動詞分類或null"}]\n\n日文句子：'+s;
fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(apiKey),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{maxOutputTokens:2000,temperature:0.1,thinkingConfig:{thinkingBudget:0}}})}).then(function(r){return r.json();}).then(function(data){
const raw=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts&&data.candidates[0].content.parts.map(function(p){return p.text||'';}).join('')||'';
const cleaned=raw.replace(/```json\s*/g,'').replace(/```\s*/g,'').trim();
try{const blocks=JSON.parse(cleaned);renderXray(blocks,true);}
catch(e){console.warn('Gemini JSON parse failed, falling back to local:',e,cleaned);xrayParseLocal(s);}
}).catch(function(e){console.warn('Gemini API error, falling back to local:',e);xrayParseLocal(s);});}

else if(r.role&&r.role!=='null'){
h+='<div style="font-size:.65rem;color:rgba(255,255,255,.35)">🏷️ '+eH(r.role)+'</div>';}
