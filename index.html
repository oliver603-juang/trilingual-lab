<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0c0c1a">
<title>三語句型積木</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c1a;--surface:#151528;--card:#1c1c35;--border:#2a2a4a;--text:#e8e6f0;--dim:#8888aa;--jp:#ff6b6b;--en:#4ecdc4;--gold:#ffd700;--cn:#ffa94d}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);-webkit-user-select:text;user-select:text}
.header{padding:10px 14px 6px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.logo{font-size:1rem;font-weight:900;background:linear-gradient(135deg,var(--jp),var(--en));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sw,.lt{display:flex;background:var(--surface);border-radius:18px;border:1px solid var(--border);overflow:hidden}
.ub,.lb{padding:4px 10px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:.68rem;font-weight:700;cursor:pointer}
.ub.a{background:rgba(255,215,0,.1);color:var(--gold)}.lt{margin-left:auto}
.lb.a-jp{background:rgba(255,107,107,.12);color:var(--jp)}.lb.a-en{background:rgba(78,205,196,.12);color:var(--en)}.lb.a-vs{background:rgba(255,215,0,.1);color:var(--gold)}
.badge{padding:2px 7px;border-radius:9px;font-size:.58rem}.sb{background:var(--surface);border:1px solid var(--border);color:var(--dim)}.pb{background:rgba(80,200,120,.1);border:1px solid rgba(80,200,120,.3);color:#50c878}
.dt{display:flex;gap:3px;padding:5px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.03)}.dt::-webkit-scrollbar{display:none}
.tab{padding:3px 9px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--dim);font-family:inherit;font-size:.62rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}.tab.a{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.08)}
.mc{margin:10px;border-radius:14px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.mc.m-jp{border-color:rgba(255,107,107,.3)}.mc.m-en{border-color:rgba(78,205,196,.3)}.mc.m-vs{border-color:rgba(255,215,0,.3)}
.ca{padding:14px 18px 6px;text-align:center}.cs{font-size:1.2rem;font-weight:900;color:var(--cn)}.cd{font-size:.62rem;color:var(--dim);margin-top:3px}
.kt{margin-top:5px;padding:4px 12px;border:1px solid rgba(255,215,0,.3);border-radius:14px;background:rgba(255,215,0,.08);color:var(--gold);font-family:inherit;font-size:.68rem;font-weight:700;cursor:pointer}
.ba{padding:5px 14px 14px;min-height:70px}.br{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:5px 0;animation:fu .3s ease}
.bk{padding:5px 10px;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}.bk:hover{transform:translateY(-2px)}
.bk-r{font-size:.48rem;opacity:.45;font-weight:400}
.bk-jp{background:rgba(255,107,107,.1);border:1.5px solid rgba(255,107,107,.3);color:#ffb4b4}
.bk-en{background:rgba(78,205,196,.1);border:1.5px solid rgba(78,205,196,.3);color:#a8ece8}
.r-主角{border-left:3px solid #ff6b6b}.r-動作{border-left:3px solid #4ecdc4}.r-對象{border-left:3px solid #ffd93d}.r-修飾{border-left:3px solid #a78bfa}.r-連接{border-left:3px solid #888}.r-場景{border-left:3px solid #66bb6a}.r-目標{border-left:3px solid #ff9800}.r-時間{border-left:3px solid #42a5f5}.r-語氣{border-left:3px solid #ef5350}
.fm{text-align:center;padding:2px 10px 6px;font-size:.65rem;color:var(--dim);font-family:monospace}
.sf{border:1px solid var(--border);background:var(--surface);color:var(--dim);font-family:inherit;font-size:.65rem;padding:3px 10px;border-radius:9px;cursor:pointer}
.vc{display:grid;grid-template-columns:1fr 1fr}.vs{padding:8px 10px}.vs.js{border-right:1px solid var(--border)}
.vl{font-size:.62rem;font-weight:900;margin-bottom:5px;text-align:center}.vl.jp{color:var(--jp)}.vl.en{color:var(--en)}
.vb{padding:2px 5px;border-radius:4px;font-size:.68rem;display:flex;justify-content:space-between;margin:2px 0}.vb.jp{background:rgba(255,107,107,.07);color:#ffb4b4}.vb.en{background:rgba(78,205,196,.07);color:#a8ece8}.vt{font-size:.48rem;opacity:.35}
.cb{margin:0 14px 10px;padding:8px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--border);font-size:.7rem;line-height:1.7;color:var(--dim)}.cl{font-weight:700;margin-right:3px}
.nr{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-top:1px solid var(--border)}
.nb{width:30px;height:30px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center}.nb:disabled{opacity:.3}
.nc{font-size:.68rem;color:var(--dim);min-width:45px;text-align:center}
.dr{display:flex;gap:2px;justify-content:center;padding:0 14px 10px;flex-wrap:wrap}
.d{width:5px;height:5px;border-radius:50%;background:var(--border);cursor:pointer}.d.a-jp{background:var(--jp)}.d.a-en{background:var(--en)}.d.a-vs{background:var(--gold)}.d.sn{background:rgba(80,200,120,.5)}
.lg{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 7px;justify-content:center}.li{display:flex;align-items:center;gap:2px;font-size:.48rem;color:var(--dim)}.ld{width:4px;height:4px;border-radius:2px}
.ko{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}.ko.op{opacity:1;pointer-events:auto}
.kp{background:#1a1a35;border-radius:18px;max-width:380px;width:90%;box-shadow:0 16px 50px rgba(0,0,0,.5);overflow:hidden;border:2px solid rgba(255,255,255,.08);transform:scale(.8);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}.ko.op .kp{transform:scale(1)}
.kh{padding:14px 18px 6px;text-align:center}.ms{font-size:2rem;display:block;margin-bottom:2px}.pt{font-size:.72rem;font-weight:900;color:var(--gold)}.mt{font-size:1rem;font-weight:900;margin-top:3px;line-height:1.3}.mt.jt{color:#ff8a8a}.mt.et{color:#7eeae0}
.bs{margin:0 12px 5px;padding:8px 12px;border-radius:10px;font-size:.78rem;line-height:1.7;font-weight:700}
.bc{background:rgba(255,169,77,.1);border:1px solid rgba(255,169,77,.2);color:#ffcc88}
.bj{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.2);color:#ffb4b4}
.be{background:rgba(78,205,196,.1);border:1px solid rgba(78,205,196,.2);color:#a8ece8}
.bf{font-size:.62rem;display:block;margin-bottom:2px;opacity:.55}
.mi{margin:5px 12px 10px;padding:7px 12px;border-radius:10px;background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(255,169,77,.07));border:1px solid rgba(255,215,0,.2);text-align:center;font-size:.78rem;font-weight:900;color:var(--gold)}
.kc{margin:0 12px 12px;padding:7px;border:none;border-radius:10px;background:rgba(255,255,255,.05);color:var(--dim);font-family:inherit;font-size:.72rem;font-weight:700;width:calc(100% - 24px);cursor:pointer}.kc:hover{background:rgba(255,255,255,.1);color:#fff}
.ld-c{display:flex;align-items:center;justify-content:center;height:50vh;flex-direction:column;gap:8px}.ld-t{color:var(--dim);font-size:.78rem}
.sp{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.ko.op .ms{animation:bn 1s ease-in-out .3s}
</style>
</head>
<body>
<div class="header">
<div class="logo">三語句型積木</div>
<div class="sw"><button class="ub a" onclick="sU('iggy')">🐱 Iggy</button><button class="ub" onclick="sU('yoyo')">🐸 Yoyo</button></div>
<div class="lt"><button class="lb a-jp" onclick="sM('jp')">🇯🇵 日文</button><button class="lb" onclick="sM('en')">🇺🇸 英文</button><button class="lb" onclick="sM('vs')">⚡ 對比</button></div>
<span class="badge sb" id="sb">0 句</span><span class="badge pb" id="pb">✅ 0</span>
</div>
<div class="dt" id="dt"></div>
<div id="app"><div class="ld-c"><div class="sp"></div><div class="ld-t">載入中…</div></div></div>
<div class="ko" id="ko" onclick="if(event.target===this)cK()"><div class="kp" id="kpp"></div></div>
<script>
let R=[],F=[],ci=0,md='jp',cu='iggy';
const sy=speechSynthesis;let jv=null,ev=null;
function iV(){const v=sy.getVoices();jv=v.find(v=>v.lang.startsWith('ja'));ev=v.find(v=>v.lang.startsWith('en'));}
sy.onvoiceschanged=iV;iV();
function sp(t,l){sy.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=l==='jp'?'ja-JP':'en-US';u.rate=0.8;if(l==='jp'&&jv)u.voice=jv;if(l==='en'&&ev)u.voice=ev;sy.speak(u);}
function lU(){try{return JSON.parse(localStorage.getItem('tl_'+cu)||'{}');}catch{return {};}}
function sV(d){localStorage.setItem('tl_'+cu,JSON.stringify(d));}
function mS(id){const d=lU();if(!d.seen)d.seen={};d.seen[id]=Date.now();sV(d);}
function iS(id){const d=lU();return d.seen&&d.seen[id];}
function gS(){const d=lU();return Object.keys(d.seen||{}).length;}
function sU(u){cu=u;document.querySelectorAll('.ub').forEach(b=>{b.classList.toggle('a',b.textContent.includes(u==='iggy'?'Iggy':'Yoyo'));});uP();rn();}
function uP(){document.getElementById('pb').textContent='✅ '+gS();}
async function lD(){try{const r=await fetch('unified-rules.json');if(!r.ok)throw 0;const d=await r.json();
R=d.map(r=>({id:r.id,dim:r.dimension_label||r.dimension,cn:r.chinese,lv:r.jlpt||'',
jp:r.jp?{s:r.jp.sentence,b:r.jp.blocks.map(b=>[b.text,b.role]),f:r.jp.formula||''}:null,
en:r.en?{s:r.en.sentence,b:r.en.blocks.map(b=>[b.text,b.role]),f:r.en.formula||''}:null,
ct:r.contrast||{}}));}catch{document.getElementById('app').innerHTML='<div class="ld-c"><div class="ld-t">請將 unified-rules.json 放在同目錄</div></div>';return;}
F=R;document.getElementById('sb').textContent=R.length+' 句';rDT();uP();rn();}
function rDT(){const ds={};R.forEach(r=>{ds[r.dim]=(ds[r.dim]||0)+1;});const s=Object.entries(ds).sort((a,b)=>b[1]-a[1]);
let h='<button class="tab a" onclick="fD(\'all\')">全部 '+R.length+'</button>';
for(const[d,c]of s)h+='<button class="tab" onclick="fD(\''+d.replace(/'/g,"\\'")+'\')">' +d+' '+c+'</button>';
document.getElementById('dt').innerHTML=h;}
function fD(d){ci=0;F=d==='all'?R:R.filter(r=>r.dim===d);document.getElementById('sb').textContent=F.length+' 句';
document.querySelectorAll('.tab').forEach(t=>{const td=t.textContent.replace(/\s*\d+$/,'').trim();t.classList.toggle('a',d==='all'?td.startsWith('全部'):td===d);});rn();}
function sM(m){md=m;document.querySelectorAll('.lb').forEach(b=>b.className='lb');const bs=document.querySelectorAll('.lb');
if(m==='jp')bs[0].classList.add('a-jp');else if(m==='en')bs[1].classList.add('a-en');else bs[2].classList.add('a-vs');rn();}
function nv(d){ci=Math.max(0,Math.min(F.length-1,ci+d));rn();}
function gT(i){ci=i;rn();}
function eH(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rn(){if(!F.length){document.getElementById('app').innerHTML='<div class="ld-c"><div class="ld-t">沒有符合的句子</div></div>';return;}
const r=F[ci];mS(r.id);uP();const hk=!!KD[r.dim]||(md==='en'&&!!EK[r.dim]);let bh='';
if(md==='vs'){bh=rVS(r);}else{const d=r[md];if(!d){bh='<div style="text-align:center;padding:14px;color:var(--dim)">此句無'+(md==='jp'?'日文':'英文')+'資料</div>';}
else{bh='<div class="br">';d.b.forEach(([t,rl])=>{bh+='<div class="bk bk-'+md+' r-'+rl+'" onclick="sp(\''+t.replace(/'/g,"\\'")+'\';\''+md+'\')">'+t+'<span class="bk-r">'+rl+'</span></div>';});
bh+='</div><div class="fm">'+eH(d.f)+'</div><div style="text-align:center;padding:0 0 6px"><button class="sf" onclick="sp(\''+d.s.replace(/'/g,"\\'")+'\';\''+md+'\')">🔊 '+eH(d.s)+'</button></div>';}}
let ct='';if(r.ct&&(r.ct.cn_blindspot||r.ct.jp_insight||r.ct.en_insight)){ct='<div class="cb">';
if(r.ct.cn_blindspot)ct+='<div><span class="cl" style="color:var(--cn)">🇹🇼 中文陷阱：</span>'+eH(r.ct.cn_blindspot)+'</div>';
if(r.ct.jp_insight)ct+='<div><span class="cl" style="color:var(--jp)">🇯🇵 日文邏輯：</span>'+eH(r.ct.jp_insight)+'</div>';
if(r.ct.en_insight)ct+='<div><span class="cl" style="color:var(--en)">🇺🇸 英文邏輯：</span>'+eH(r.ct.en_insight)+'</div>';ct+='</div>';}
const mx=Math.min(F.length,30);let dt='<div class="dr">';for(let i=0;i<mx;i++){const dc=i===ci?' a-'+md:'';const sn=iS(F[i].id)?' sn':'';dt+='<div class="d'+dc+sn+'" onclick="gT('+i+')"></div>';}
if(F.length>mx)dt+='<span style="color:var(--dim);font-size:.48rem;align-self:center">+'+(F.length-mx)+'</span>';dt+='</div>';
const lg='<div class="lg"><div class="li"><div class="ld" style="background:#ff6b6b"></div>主角</div><div class="li"><div class="ld" style="background:#4ecdc4"></div>動作</div><div class="li"><div class="ld" style="background:#ffd93d"></div>對象</div><div class="li"><div class="ld" style="background:#a78bfa"></div>修飾</div><div class="li"><div class="ld" style="background:#888"></div>連接</div><div class="li"><div class="ld" style="background:#66bb6a"></div>場景</div><div class="li"><div class="ld" style="background:#ff9800"></div>目標</div><div class="li"><div class="ld" style="background:#42a5f5"></div>時間</div><div class="li"><div class="ld" style="background:#ef5350"></div>語氣</div></div>';
document.getElementById('app').innerHTML='<div class="mc m-'+md+'"><div class="ca"><div class="cs">'+eH(r.cn)+'</div><div class="cd">'+eH(r.dim)+(r.lv?' · '+r.lv:'')+'</div>'+(hk?'<button class="kt" onclick="sK(\''+r.dim.replace(/'/g,"\\'")+'\')" >💡 小學生魔法教室</button>':'')+'</div><div class="ba">'+bh+'</div>'+ct+lg+'<div class="nr"><button class="nb" onclick="nv(-1)"'+(ci===0?' disabled':'')+'>◀</button><span class="nc">'+(ci+1)+' / '+F.length+'</span><button class="nb" onclick="nv(1)"'+(ci>=F.length-1?' disabled':'')+'>▶</button></div>'+dt+'</div>';}
function rVS(r){let h='<div class="vc"><div class="vs js"><div class="vl jp">🇯🇵 日文</div>';
if(r.jp){r.jp.b.forEach(([t,rl])=>{h+='<div class="vb jp r-'+rl+'" onclick="sp(\''+t.replace(/'/g,"\\'")+'\';\'jp\')"><span>'+t+'</span><span class="vt">'+rl+'</span></div>';});h+='<div style="font-size:.52rem;color:var(--dim);margin-top:3px;text-align:center">'+eH(r.jp.f)+'</div>';}
else h+='<div style="color:var(--dim);font-size:.62rem">無資料</div>';h+='</div><div class="vs"><div class="vl en">🇺🇸 英文</div>';
if(r.en){r.en.b.forEach(([t,rl])=>{h+='<div class="vb en r-'+rl+'" onclick="sp(\''+t.replace(/'/g,"\\'")+'\';\'en\')"><span>'+t+'</span><span class="vt">'+rl+'</span></div>';});h+='<div style="font-size:.52rem;color:var(--dim);margin-top:3px;text-align:center">'+eH(r.en.f)+'</div>';}
else h+='<div style="color:var(--dim);font-size:.62rem">無資料</div>';h+='</div></div>';return h;}
