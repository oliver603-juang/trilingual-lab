<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<style>
:root{--bg:#0c0c1a;--surface:#151528;--card:#1c1c35;--border:#2a2a4a;--text:#e8e6f0;--dim:#8888aa;--jp:#ff6b6b;--en:#4ecdc4;--gold:#ffd700;--cn:#ffa94d}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);-webkit-user-select:text;user-select:text}
.header{padding:10px 14px 6px;display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.logo{font-size:1rem;font-weight:900;background:linear-gradient(135deg,var(--jp),var(--en));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sw,.lt{display:flex;background:var(--surface);border-radius:18px;border:1px solid var(--border);overflow:hidden}
.ub,.lb{padding:4px 10px;border:none;background:transparent;color:var(--dim);font-family:inherit;font-size:.72rem;font-weight:700;cursor:pointer}
.ub.a{background:rgba(255,215,0,.1);color:var(--gold)}.lt{margin-left:auto}
.hn{display:flex;align-items:center;gap:4px;margin:0 auto}
.nb{width:28px;height:28px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);font-size:.8rem;cursor:pointer;display:flex;align-items:center;justify-content:center}.nb:disabled{opacity:.3}
.nc{font-size:.72rem;color:var(--dim);min-width:40px;text-align:center}
.lb.a-jp{background:rgba(255,107,107,.12);color:var(--jp)}.lb.a-en{background:rgba(78,205,196,.12);color:var(--en)}.lb.a-vs{background:rgba(255,215,0,.1);color:var(--gold)}
.badge{padding:2px 7px;border-radius:9px;font-size:.58rem}.sb{background:var(--surface);border:1px solid var(--border);color:var(--dim)}.pb{background:rgba(80,200,120,.1);border:1px solid rgba(80,200,120,.3);color:#50c878}
.dt{display:flex;gap:3px;padding:5px 10px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid rgba(255,255,255,.03)}.dt::-webkit-scrollbar{display:none}
.tab{padding:3px 9px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--dim);font-family:inherit;font-size:.62rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}.tab.a{border-color:var(--gold);color:var(--gold);background:rgba(255,215,0,.08)}
.mc{margin:10px;border-radius:14px;background:var(--card);border:1px solid var(--border);overflow:hidden}
.mc.m-jp{border-color:rgba(255,107,107,.3)}.mc.m-en{border-color:rgba(78,205,196,.3)}.mc.m-vs{border-color:rgba(255,215,0,.3)}
.ca{padding:14px 18px 6px;text-align:center}.cs{font-size:1.5rem;font-weight:900;color:var(--cn)}.cd{font-size:.72rem;color:var(--dim);margin-top:3px}
.kt{margin-top:5px;padding:4px 12px;border:1px solid rgba(255,215,0,.3);border-radius:14px;background:rgba(255,215,0,.08);color:var(--gold);font-family:inherit;font-size:.68rem;font-weight:700;cursor:pointer}
.ba{padding:5px 14px 14px;min-height:70px}.br{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:5px 0;animation:fu .3s ease}
.bk{padding:8px 14px;border-radius:10px;font-weight:700;font-size:1.05rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}.bk:hover{transform:translateY(-2px)}
.bk-r{font-size:.55rem;opacity:.45;font-weight:400}
ruby{ruby-align:center}ruby rt{font-size:.5rem;font-weight:400;opacity:.6;color:#ffc0c0}
.bk-jp ruby rt{visibility:visible}.bk-en ruby rt{visibility:hidden}
.block-row-jp .bk{padding-top:18px}
.br{min-height:60px}
.bk-jp{background:rgba(255,107,107,.1);border:1.5px solid rgba(255,107,107,.3);color:#ffb4b4}
.bk-en{background:rgba(78,205,196,.1);border:1.5px solid rgba(78,205,196,.3);color:#a8ece8}
.r-主角{border-left:3px solid #ff6b6b}.r-動作{border-left:3px solid #4ecdc4}.r-對象{border-left:3px solid #ffd93d}.r-修飾{border-left:3px solid #a78bfa}.r-連接{border-left:3px solid #888}.r-場景{border-left:3px solid #66bb6a}.r-目標{border-left:3px solid #ff9800}.r-時間{border-left:3px solid #42a5f5}.r-語氣{border-left:3px solid #ef5350}
.fm{text-align:center;padding:2px 10px 6px;font-size:.78rem;color:var(--dim);font-family:monospace}
.sf{border:1px solid var(--border);background:var(--surface);color:var(--dim);font-family:inherit;font-size:.75rem;padding:4px 12px;border-radius:9px;cursor:pointer}
.vc{display:grid;grid-template-columns:1fr 1fr}.vs{padding:8px 10px}.vs.js{border-right:1px solid var(--border)}
.vl{font-size:.62rem;font-weight:900;margin-bottom:5px;text-align:center}.vl.jp{color:var(--jp)}.vl.en{color:var(--en)}
.vb{padding:2px 5px;border-radius:4px;font-size:.68rem;display:flex;justify-content:space-between;margin:2px 0}.vb.jp{background:rgba(255,107,107,.07);color:#ffb4b4}.vb.en{background:rgba(78,205,196,.07);color:#a8ece8}.vt{font-size:.48rem;opacity:.35}
.cb{margin:0 14px 10px;padding:10px 14px;border-radius:9px;background:var(--surface);border:1px solid var(--border);font-size:.82rem;line-height:1.7;color:var(--dim)}.cl{font-weight:700;margin-right:3px}
.nr{display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-top:1px solid var(--border)}
.nb{width:30px;height:30px;border:1px solid var(--border);border-radius:50%;background:var(--surface);color:var(--text);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center}.nb:disabled{opacity:.3}
.nc{font-size:.68rem;color:var(--dim);min-width:45px;text-align:center}
.dr{display:flex;gap:2px;justify-content:center;padding:0 14px 10px;flex-wrap:wrap}
.d{width:5px;height:5px;border-radius:50%;background:var(--border);cursor:pointer}.d.a-jp{background:var(--jp)}.d.a-en{background:var(--en)}.d.a-vs{background:var(--gold)}.d.sn{background:rgba(80,200,120,.5)}
.lg{display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 7px;justify-content:center}.li{display:flex;align-items:center;gap:2px;font-size:.48rem;color:var(--dim)}.ld{width:4px;height:4px;border-radius:2px}
.ko{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}.ko.op{opacity:1;pointer-events:auto}
.kp{background:#1a1a35;border-radius:18px;max-width:380px;width:90%;box-shadow:0 16px 50px rgba(0,0,0,.5);overflow:hidden;border:2px solid rgba(255,255,255,.08);transform:scale(.8);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}.ko.op .kp{transform:scale(1)}
.kh{padding:14px 18px 6px;text-align:center}.ms{font-size:2rem;display:block;margin-bottom:2px}.pt{font-size:.72rem;font-weight:900;color:var(--gold)}.mt{font-size:1rem;font-weight:900;margin-top:3px;line-height:1.3}.mt.jt{color:#ff8a8a}.mt.et{color:#7eeae0}
.bs{margin:0 12px 5px;padding:8px 12px;border-radius:10px;font-size:.78rem;line-height:1.7;font-weight:700}
.bc{background:rgba(255,169,77,.1);border:1px solid rgba(255,169,77,.2);color:#ffcc88}
.bj{background:rgba(255,107,107,.1);border:1px solid rgba(255,107,107,.2);color:#ffb4b4}
.be{background:rgba(78,205,196,.1);border:1px solid rgba(78,205,196,.2);color:#a8ece8}
.bf{font-size:.62rem;display:block;margin-bottom:2px;opacity:.55}
.mi{margin:5px 12px 10px;padding:7px 12px;border-radius:10px;background:linear-gradient(135deg,rgba(255,215,0,.1),rgba(255,169,77,.07));border:1px solid rgba(255,215,0,.2);text-align:center;font-size:.78rem;font-weight:900;color:var(--gold)}
.kc{margin:0 12px 12px;padding:7px;border:none;border-radius:10px;background:rgba(255,255,255,.05);color:var(--dim);font-family:inherit;font-size:.72rem;font-weight:700;width:calc(100% - 24px);cursor:pointer}.kc:hover{background:rgba(255,255,255,.1);color:#fff}
.ld-c{display:flex;align-items:center;justify-content:center;height:50vh;flex-direction:column;gap:8px}.ld-t{color:var(--dim);font-size:.78rem}
.sp{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
@keyframes bn{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}.ko.op .ms{animation:bn 1s ease-in-out .3s}
.ki{margin:0 12px 12px;border-radius:14px;background:#1a1a35;border:1.5px solid rgba(255,215,0,.12);overflow:hidden;animation:fu .3s ease;position:relative}
.ki-h{padding:10px 14px 4px;display:flex;align-items:center;justify-content:center;gap:6px}
.ki-ms{font-size:1.6rem}.ki-tt{font-size:.78rem;font-weight:900;color:var(--gold)}
.ki-mt{text-align:center;padding:0 14px 6px;font-size:1.05rem;font-weight:900;line-height:1.3}
.ki-mt.jt{color:#ff8a8a}.ki-mt.et{color:#7eeae0}
.ki-b{margin:0 10px 5px;padding:8px 12px;border-radius:9px;font-size:.85rem;line-height:1.7;font-weight:700}
.ki-cn{background:rgba(255,169,77,.07);border:1px solid rgba(255,169,77,.12);color:#ffcc88}
.ki-jp{background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.12);color:#ffb4b4}
.ki-en{background:rgba(78,205,196,.07);border:1px solid rgba(78,205,196,.12);color:#a8ece8}
.ki-fl{font-size:.58rem;display:block;margin-bottom:2px;opacity:.5}
.ki-tp{margin:3px 10px 10px;padding:6px 12px;border-radius:9px;background:linear-gradient(135deg,rgba(255,215,0,.07),rgba(255,169,77,.04));border:1px solid rgba(255,215,0,.12);text-align:center;font-size:.85rem;font-weight:900;color:var(--gold)}
.diy{margin:0 12px 12px;border-radius:14px;background:#1a1a35;border:1.5px solid rgba(255,215,0,.12);overflow:hidden;padding:10px 14px}
.diy-h{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:8px}
.diy-h span:first-child{font-size:1.1rem}.diy-h span:last-child{font-size:.75rem;font-weight:900;color:#ffd700}
.diy-input{display:flex;gap:6px;margin-bottom:8px}
.diy-input input{flex:1;padding:8px 12px;border-radius:9px;border:1.5px solid rgba(255,215,0,.2);background:rgba(255,255,255,.05);color:#fff;font-size:.85rem;font-family:inherit}
.diy-input input::placeholder{color:rgba(255,255,255,.3)}
.diy-input input:focus{outline:none;border-color:rgba(255,215,0,.5)}
.diy-btn{padding:8px 16px;border-radius:9px;border:none;font-weight:900;font-size:.78rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.diy-btn.go{background:linear-gradient(135deg,#ffd700,#ff9800);color:#1a1a2e}
.diy-btn.go:disabled{opacity:.4;cursor:not-allowed}
.diy-btn.del{background:rgba(255,80,80,.15);color:#ff8888;border:1px solid rgba(255,80,80,.2);padding:4px 10px;font-size:.68rem}
.diy-result{padding:8px 12px;border-radius:9px;font-size:.85rem;line-height:1.7;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.diy-result.jp{background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.12);color:#ffb4b4}
.diy-result.en{background:rgba(78,205,196,.07);border:1px solid rgba(78,205,196,.12);color:#a8ece8}
.diy-result .diy-text{flex:1}
.diy-result .diy-speak{cursor:pointer;font-size:1.1rem;opacity:.7;flex-shrink:0}.diy-result .diy-speak:hover{opacity:1}
.diy-saved{margin-top:6px;border-top:1px solid rgba(255,255,255,.06);padding-top:8px}
.diy-saved-h{font-size:.62rem;color:rgba(255,255,255,.3);margin-bottom:4px}
.diy-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.diy-item .diy-speak{cursor:pointer;font-size:.95rem;opacity:.6;flex-shrink:0}.diy-item .diy-speak:hover{opacity:1}
.diy-item .diy-body{flex:1;min-width:0}
.diy-item .diy-tr{font-size:.82rem;font-weight:700;line-height:1.8}
.diy-item .diy-tr.jp{color:#ffb4b4}.diy-item .diy-tr.en{color:#a8ece8}
.diy-item .diy-tr ruby rt{font-size:.48rem;font-weight:400;opacity:.55;color:#ffc0c0}
.diy-item .diy-cn{font-size:.62rem;color:rgba(255,255,255,.3);margin-top:1px}
.diy-loading{text-align:center;padding:12px;font-size:.75rem;color:rgba(255,215,0,.6)}
.diy-loading::after{content:'';display:inline-block;width:12px;height:12px;border:2px solid rgba(255,215,0,.3);border-top-color:#ffd700;border-radius:50%;animation:spin .6s linear infinite;margin-left:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.gear-icon{padding:3px 8px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--dim);font-size:.68rem;cursor:pointer;font-family:inherit;white-space:nowrap}
.gear-icon:hover{border-color:rgba(255,215,0,.4);color:var(--gold)}
.gear-icon.has-key{border-color:rgba(80,200,120,.3);color:#50c878}
.set-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:99998;display:none;align-items:center;justify-content:center}
.set-overlay.show{display:flex}
.set-box{background:#1a1a35;border:1.5px solid rgba(255,215,0,.2);border-radius:16px;padding:20px;max-width:360px;width:90%;margin:20px}
.set-box h3{color:#ffd700;font-size:.85rem;margin-bottom:10px;text-align:center}
.set-box label{font-size:.68rem;color:rgba(255,255,255,.5);display:block;margin-bottom:4px}
.set-box input{width:100%;padding:8px 12px;border-radius:9px;border:1.5px solid rgba(255,215,0,.2);background:rgba(255,255,255,.05);color:#fff;font-size:.78rem;font-family:monospace;box-sizing:border-box;margin-bottom:8px}
.set-box input:focus{outline:none;border-color:rgba(255,215,0,.5)}
.set-box .set-hint{font-size:.6rem;color:rgba(255,255,255,.3);line-height:1.5;margin-bottom:10px}
.set-box .set-counter{font-size:.65rem;color:rgba(255,255,255,.4);margin-bottom:10px;padding:6px 10px;background:rgba(255,255,255,.03);border-radius:8px}
.set-box .set-btns{display:flex;gap:8px;justify-content:center}
.set-box .set-btns button{padding:8px 20px;border-radius:9px;border:none;font-weight:900;font-size:.75rem;cursor:pointer;font-family:inherit}
.set-box .set-btns .save{background:linear-gradient(135deg,#ffd700,#ff9800);color:#1a1a2e}
.set-box .set-btns .cancel{background:rgba(255,255,255,.08);color:rgba(255,255,255,.5)}
.diy-nokey{text-align:center;padding:8px;font-size:.7rem;color:rgba(255,255,255,.3);line-height:1.6}
.diy-nokey button{background:none;border:none;color:#ffd700;cursor:pointer;text-decoration:underline;font-family:inherit;font-size:.7rem}
.edit-toggle{padding:3px 8px;border-radius:10px;border:1px solid rgba(255,215,0,.2);background:rgba(255,215,0,.05);color:var(--gold);font-family:inherit;font-size:.58rem;font-weight:700;cursor:pointer;white-space:nowrap;position:absolute;right:10px;top:10px}
.edit-toggle.active{background:rgba(255,50,50,.15);border-color:rgba(255,50,50,.3);color:#ff8888}
.edit-mode .ki-b,.edit-mode .ki-tp,.edit-mode .cb{cursor:text;border:1px dashed rgba(255,215,0,.3)}
.edit-mode .ki-b:hover,.edit-mode .ki-tp:hover,.edit-mode .cb:hover{border-color:rgba(255,215,0,.6)}
.edit-mode .ki-b:focus,.edit-mode .ki-tp:focus,.edit-mode .cb:focus{outline:none;border-color:#ffd700;background:rgba(255,215,0,.05)}
.edit-saved{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:10px 24px;border-radius:12px;background:rgba(80,200,120,.9);color:#fff;font-weight:700;font-size:.85rem;z-index:99999;pointer-events:none;animation:eo 1.5s ease forwards}
@keyframes eo{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<div class="header">
<div class="logo">三語句型積木</div>
<div class="sw"><button class="ub a" onclick="sU('iggy')">🐱 Iggy</button><button class="ub" onclick="sU('yoyo')">🐸 Yoyo</button><button class="ub" onclick="sU('yofarn')">🦉 Yofarn</button><button class="ub" onclick="sU('oliver')">🦊 Oliver</button></div>

const KD={"基本句型 SVO/SOV":{"m":"🦊","t":"Iggy","mt":"🔀 動作搬家大作戰！","cn":"中文和英文排隊一樣：誰→做什麼→什麼東西。我 去 學校。","br":"日文的動作超級懶！永遠站在隊伍最後面！私は（我）→ 学校に（學校）→ 行きます（去）。中文英文：我 去 學校。日文：我 學校 去。動作跑到最後面去了！而且每個東西都要貼名牌（は＝我是主角、に＝目標方向）！","tp":"💡 日文的動作永遠排最後，而且每個字都要貼名牌！","th":"jp"},"助詞導航":{"m":"🦊","t":"Iggy","mt":"🏷️ 每個人都要戴名牌！","cn":"中文靠排隊就知道誰做什麼。","br":"日文可以亂排隊！所以每個字後面要貼名牌。「は」=我是主角！「を」=我是被處理掉的！","tp":"💡 看到「を」就知道這東西要被處理掉啦！","th":"jp"},"て形串連":{"m":"🦊","t":"Iggy","mt":"🔗 動作的超級黏黏膠水！","cn":"中文用逗號串動作：起床，吃飯，出門。","br":"日文要給每個動作塗上「て」這款強力膠水！起きて→食べて→出かけます。最後一個不用塗。","tp":"💡 看到「て」就知道後面還有動作！","th":"jp"},"存在句":{"m":"🦊","t":"Iggy","mt":"🐱 會動的和不會動的分開說！","cn":"中文不管什麼都說「有」。","br":"日文兩種！會動的（人、貓）用「います」，不會動的（書、桌子）用「あります」。","tp":"💡 貓會跑→います，書不會跑→あります！","th":"jp"},"被動語態":{"m":"🦊","t":"Iggy","mt":"😱 「被」有兩種心情！","cn":"中文的「被」不帶感情：被稱讚（開心）、被罵（難過），都用同一個「被」。英文 was eaten 也只是客觀描述。","br":"⚠️ 死亡陷阱：日文被動有「迷惑受身」，中文英文都沒有！\n雨に降られた ← 被雨淋了（我很倒霉！）\n中文「下雨了」只是事實，但日文「雨に降られた」動詞自帶「我是受害者」的語氣！\n\n❌ 台灣學生常犯：把所有被動都翻成中文的「被」\n⭕ 迷惑受身不是「被」，而是「因為這件事我很困擾」\n\n隣の人にタバコを吸われた\n≠ 我被隔壁的人抽菸（？）\n＝ 隔壁的人抽菸，害我很困擾！\n這種「被害感」只有日文做得到！","tp":"💡 迷惑受身＝不是「被做了什麼」，而是「因為別人做了什麼，我很困擾」！","th":"jp"},"自他動詞":{"m":"🦊","t":"Iggy","mt":"🚪 門自己開 vs 我去開門！","cn":"中文不分：動作都叫「開」。","br":"⚠️ 死亡陷阱：助詞用錯，意思完全相反！\n❌ ドアを開く ← 這是錯的！「開く」是自動詞，不能配 を！\n⭕ ドアが開く ← 門自己開了（自動詞配 が）\n⭕ ドアを開ける ← 我去開門（他動詞配 を）\n\n日文有雙胞胎動詞：\n自動詞（自己動）：開く、閉まる、消える → 配 が\n他動詞（有人弄的）：開ける、閉める、消す → 配 を\n\n中文只用一個「開」，所以台灣學生常搞混！\n記憶法：を＝有人動手處理 / が＝事情自己發生","tp":"💡 自動詞配 が（自己動），他動詞配 を（有人動手）！助詞用錯意思就反了！","th":"jp"},"條件句":{"m":"🦊","t":"Iggy","mt":"🌧️ 「如果」有四件外套！","cn":"中文只有一種「如果」。","br":"⚠️ 死亡陷阱：「たら」「ば」「と」「なら」不能隨便互換！\n❌ 春になると、花見に行きましょう ← と 不能接意志/邀請！\n⭕ 春になったら、花見に行きましょう ← たら 才能接邀請\n\n致命規則：\nと → 後面只能接「自然會發生的事」，不能接「想做的事」\n　　春になると桜が咲く ⭕（自然現象）\n　　春になると行きましょう ❌（邀請）\nたら → 最安全，什麼都能接\nば → 後面不能接過去式\nなら → 「聽說…的話」，帶有推測語氣","tp":"💡 と 後面不能接邀請/命令！不確定用哪個？たら 最安全！","th":"jp"},"禮物流向":{"m":"🦊","t":"Iggy","mt":"🎁 日文的動詞自帶箭頭方向！","cn":"中文的「給」超級萬能，不管是我給你、還是你給我，都用同一個字。","br":"⚠️⚠️⚠️ 絕對重點：くれる 的主角絕對不能是「我」！\n❌ 私は友達に本をくれる ← 這是錯的！\n⭕ 友達が私に本をくれる ← 主角必須是「給我東西的那個人」！\n\n日文的動詞自帶「箭頭方向」！同樣是我、朋友、書，動詞不同，主角和助詞就要跟著換：\n\n➡️ あげる＝向外射出的箭頭（我→朋友）\n私は 友達に 本を あげる。\n＝我把書給朋友。聚光燈（は）打在「我」，朋友貼 に。\n\n⬅️ くれる＝向內射進來的箭頭（朋友→我）\n友達が 私に 本を くれる。\n＝朋友把書給我。聚光燈（が）必須打在「朋友」，我變成 に！\n\n🤲 もらう＝我伸手去接（朋友→我）\n私は 友達に 本を もらう。\n＝我從朋友那裡收到書。聚光燈（は）回到「我」。書的方向跟 くれる 一樣，但主角換了！","tp":"💡 あげる→我送出 / くれる→別人送我（⚠️主角不能是我！）/ もらう→我收到","th":"jp"},"聚光燈 は vs が":{"m":"🦊","t":"Iggy","mt":"🔦 聚光燈照誰？","cn":"中文不分已知和新發現。","br":"⚠️ 死亡陷阱：「我喜歡貓」的「貓」不能用 は！\n❌ 猫は好きです ← 這變成「貓咪喜歡（別人）」的意思！\n⭕ 猫が好きです ← が 指出「被喜歡的對象」！\n\nは 和 が 最要命的差異：\n「象は鼻が長い」＝大象（は 主題）鼻子（が 焦點）長。\nは＝「說到這個嘛…」（舊消息、大主題）\nが＝「就是這個！」（新發現、小焦點）\n台灣學生最常錯：好き/嫌い/欲しい/怖い 前面的東西一定要用 が，不能用 は！","tp":"💡 好き嫌い欲しい怖い → 前面一定用 が！は 會讓意思完全反過來！","th":"jp"},"敬語入門":{"m":"🦊","t":"Iggy","mt":"👔 動作換穿三種衣服！","cn":"中文加「請」就夠客氣。","br":"⚠️ 死亡陷阱：對老闆用錯敬語，比不用還糟！\n❌ 社長が言いました ← 對老闆用普通形，超級不禮貌！\n❌ 社長が言ってくれました ← 把尊敬語和謙讓語搞混了！\n⭕ 社長がおっしゃいました ← 用尊敬語抬高老闆\n\n最要命的混淆：\nいる → いらっしゃる（尊敬）vs おる（謙讓）\n言う → おっしゃる（尊敬）vs 申す（謙讓）\n食べる → 召し上がる（尊敬）vs いただく（謙讓）\n\n原則：別人的動作穿華服（尊敬），自己的動作穿樸素（謙讓）。穿反了就是大不敬！","tp":"💡 別人穿華服（尊敬語），自己穿樸素（謙讓語）。穿反了是大不敬！","th":"jp"},"轉述標籤 と":{"m":"🦊","t":"Iggy","mt":"💬 別人的話要蓋章！","cn":"中文用引號包起來。","br":"日文引號後面要蓋「と」的章！看到「と言う」就知道前面是轉述別人說的！","tp":"💡「と」就是轉述認證章！","th":"jp"},"進行式/持續態":{"m":"🦊","t":"Iggy","mt":"⏳ ている 是雙面魔法！","cn":"中文「正在」很簡單。","br":"⚠️ 死亡陷阱：ている 不一定是「正在做」！\n❌ 結婚している＝正在結婚（？）\n⭕ 結婚している＝已婚（持續的狀態）\n\n❌ 死んでいる＝正在死（？）\n⭕ 死んでいる＝已經死了（結果的狀態）\n\nている 有兩張臉：\n① 正在做：食べている＝正在吃\n② 狀態持續：知っている＝知道（不是正在知道）\n怎麼分？看動詞是「持續性」還是「瞬間性」！\n走る（跑）→ 走っている＝正在跑（持續動作）\n着く（到達）→ 着いている＝已經到了（瞬間結果）","tp":"💡 ている 有兩張臉！結婚している＝已婚、死んでいる＝已死，不是「正在」！","th":"jp"},"漢字陷阱":{"m":"🦊","t":"Iggy","mt":"⚠️ 長得像但意思不同的雙胞胎！","cn":"看到漢字覺得「我認識！」","br":"⚠️ 死亡陷阱：長得一模一樣，意思完全不同！\n❌ 以為日文漢字＝中文意思 ← 最容易被騙！\n\n致命清單：\n「勉強」中文＝勉強 → 日文＝讀書 📖\n「大丈夫」中文＝男子漢 → 日文＝沒問題 👌\n「手紙」中文＝衛生紙 → 日文＝信 ✉️\n「娘」中文＝媽媽的娘 → 日文＝女兒 👧\n「怪我」中文＝怪我 → 日文＝受傷 🤕\n「切手」中文＝切手 → 日文＝郵票 📮\n「丈夫」中文＝老公 → 日文＝堅固 💪\n\n看到漢字千萬不要猜！日文漢字是最甜的陷阱！","tp":"💡 勉強＝讀書、大丈夫＝沒問題、手紙＝信、娘＝女兒！看到漢字不要猜！","th":"jp"},"修飾語/連體":{"m":"🦊","t":"Iggy","mt":"🎨 形容的話全塞在名詞前面！","cn":"中文：「教日語的老師」「跑步的人」「昨天買的書」，用「的」把形容的話放在名詞前面。","br":"日文跟中文一樣放前面！而且不管多長都塞在前面：日本語を教える先生＝教日語的老師。走っている人＝跑步的人。昨日買った本＝昨天買的書。母が焼いたケーキ＝媽媽烤的蛋糕。中文要用「的」黏起來，但日文不用「的」，動詞直接貼在名詞前面就好！","tp":"💡 日文跟中文一樣放前面，但不用「的」，動詞直接黏上去！","th":"jp"},"推測 でしょう":{"m":"🦊","t":"Iggy","mt":"🤔 「大概吧」的魔法尾巴！","cn":"中文說「大概」「可能」就好。","br":"日文在句尾加「でしょう」就變猜測語氣！像加了「大概吧」的尾巴。","tp":"💡 でしょう=大概吧、應該吧！","th":"jp"},"ように 目標":{"m":"🦊","t":"Iggy","mt":"🎯 為了變成那個樣子！","cn":"中文說「為了」就好。","br":"ように像瞄準目標！「上手になるように」=為了變厲害。先看目標再拉弓！","tp":"💡 ように=為了變成那個樣子！","th":"jp"},"のに 轉折":{"m":"🦊","t":"Iggy","mt":"😤 明明就…結果卻…！","cn":"中文「明明…卻…」","br":"のに就是不爽！勉強したのに落ちた=明明讀了卻沒過。充滿「好氣」的感覺！","tp":"💡 のに=明明就…結果卻…（好氣）！","th":"jp"},"ので 原因":{"m":"🦊","t":"Iggy","mt":"📋 客氣地說理由！","cn":"中文「因為…所以…」","br":"ので是很客氣地說理由！比「から」有禮貌，跟老師說話用ので比較好！","tp":"💡 ので=有禮貌地說「因為」！","th":"jp"},"ほど 程度":{"m":"🦊","t":"Iggy","mt":"📏 誇張到什麼程度！","cn":"中文「辣到哭」「累死了」","br":"ほど=到了…的程度！泣くほど辛い=辣到會哭。像放大鏡把誇張放更大！","tp":"💡 ほど=到了…的程度！","th":"jp"},"使役形":{"m":"🦊","t":"Iggy","mt":"👆 叫別人去做的命令貼紙！","cn":"中文說「叫他去」「讓他做」就好。","br":"日文的動作可以貼上「させる」的命令貼紙！食べる→食べさせる=叫別人吃。像是幫動作加了一個「你去做」的命令！","tp":"💡 させる=叫別人去做！","th":"jp"},"ために 目的":{"m":"🦊","t":"Iggy","mt":"🎯 就是為了這個目的！","cn":"中文「為了」就好。","br":"ために比ように更直接！大学に入るために勉強する。目標明確決心堅定！","tp":"💡 ために=就是為了這個目的！","th":"jp"},"工具箱 で":{"m":"🦊","t":"Iggy","mt":"🔧 用什麼工具、在哪裡做！","cn":"中文靠前後文。","br":"で像工具箱！箸で食べる=用筷子吃。公園で遊ぶ=在公園玩。一個で兩種用法！","tp":"💡 で=用什麼工具 或 在哪裡！","th":"jp"},"使役 させる":{"m":"🦊","t":"Iggy","mt":"👆 叫別人去做的命令貼紙！","cn":"中文說「叫他去」「讓他做」就好。","br":"日文的動作可以貼上「させる」的命令貼紙！食べる→食べさせる=叫別人吃。像是幫動作加了一個「你去做」的命令！","tp":"💡 させる=叫別人去做！","th":"jp"},"〜きらいがある":{"m":"🦊","t":"Iggy","mt":"😬 壞習慣偵測器！","cn":"中文說「他總是…」「他有…的傾向」。","br":"「きらいがある」是壞習慣偵測器！先延ばしにするきらいがある=有拖延的壞習慣。通常用來說別人的缺點！","tp":"💡 きらいがある=有…的壞習慣！","th":"jp"},"〜ずくめ":{"m":"🦊","t":"Iggy","mt":"🎨 全部都是同一色！","cn":"中文說「全是…」「盡是…」。","br":"「ずくめ」就是從頭到尾都是同一種東西！いいことずくめ＝全都是好事（今年盡是好事）。黒ずくめ＝全身黑。像是整個人被同一個顏色塗滿了！","tp":"💡 ずくめ＝從頭到尾全是！","th":"jp"},"〜を限りに":{"m":"🦊","t":"Iggy","mt":"✂️ 在這裡剪斷！","cn":"中文說「以…為限」「到…為止」。","br":"「を限りに」像一把剪刀！今日を限りに=以今天為界線，剪斷！之後就不再做了。","tp":"💡 を限りに=到此為止，剪斷！","th":"jp"},"〜に即して":{"m":"🦊","t":"Iggy","mt":"📏 貼著尺走！","cn":"中文說「根據…」「按照…」。","br":"「に即して」就是緊緊貼著規則走！現実に即して=貼著現實走，不能天馬行空。","tp":"💡 に即して=緊貼著…來做！","th":"jp"},"〜ともなると":{"m":"🦊","t":"Iggy","mt":"👑 到了那個等級就不一樣！","cn":"中文說「一旦到了…的程度」。","br":"「ともなると」是等級提升！社長ともなると=一旦當上社長。到了那個等級，事情就完全不一樣了。","tp":"💡 ともなると=到了那個等級就不同！","th":"jp"},"〜まじき":{"m":"🦊","t":"Iggy","mt":"🚫 不配這個身分！","cn":"中文說「不該有的」「不配的」。","br":"「まじき」是嚴厲的批評！教師にあるまじき行為=身為老師不該有的行為。帶著很失望的語氣。","tp":"💡 まじき=不配這個身分的行為！","th":"jp"},"〜ずにはいられない":{"m":"🦊","t":"Iggy","mt":"🌊 忍不住的衝動！","cn":"中文說「忍不住…」「不得不…」。","br":"「ずにはいられない」就是怎麼忍都忍不住！泣かずにはいられない=忍不住想哭。完全擋不住的感覺！","tp":"💡 ずにはいられない=忍不住！","th":"jp"},"〜ざるを得ない":{"m":"🦊","t":"Iggy","mt":"😩 不想做但不得不做！","cn":"中文說「不得不…」「只好…」。","br":"「ざるを得ない」是心不甘情不願但沒辦法！出席せざるを得ない=不得不出席。充滿無奈的感覺！","tp":"💡 ざるを得ない=不想但不得不！","th":"jp"},"〜にかたくない":{"m":"🦊","t":"Iggy","mt":"🤔 不難想像！","cn":"中文說「不難想像」「可以理解」。","br":"「にかたくない」=一點都不難想像！想像にかたくない=不難想像。書面語比較常用！","tp":"💡 にかたくない=不難想像！","th":"jp"},"〜べく":{"m":"🦊","t":"Iggy","mt":"🎯 為了達成而努力！","cn":"中文說「為了…」。","br":"「べく」是很文雅的「為了」！夢を実現すべく=為了實現夢想。像騎士為了完成使命而出發！","tp":"💡 べく=為了…（很有決心）！","th":"jp"},"〜かたわら":{"m":"🦊","t":"Iggy","mt":"🤹 一邊做A一邊做B！","cn":"中文說「一邊…一邊…」。","br":"「かたわら」是同時做兩件正經事！教師をするかたわら小説を書く=一邊當老師一邊寫小說。","tp":"💡 かたわら=認真地一邊…一邊…！","th":"jp"},"〜なり":{"m":"🦊","t":"Iggy","mt":"⚡ 一…馬上就…！","cn":"中文說「一…就…」。","br":"「なり」是超級快！帰宅するなり寝た=一回到家馬上就睡了。比「たら」更快更突然。","tp":"💡 なり=一做完馬上就！","th":"jp"},"〜そばから":{"m":"🦊","t":"Iggy","mt":"🔄 做了馬上又沒了！","cn":"中文說「才剛…就…」。","br":"「そばから」是白做工的感覺！覚えたそばから忘れる=才剛記住馬上就忘。一直重複白忙！","tp":"💡 そばから=才剛做完就白費了！","th":"jp"},"〜ものを":{"m":"🦊","t":"Iggy","mt":"😤 明明可以的偏偏不…！","cn":"中文說「明明…卻偏偏…」。","br":"「ものを」充滿遺憾！聞けば教えたものを=你問的話我就教你了，偏偏你不問！","tp":"💡 ものを=明明可以卻偏不！（好可惜）","th":"jp"},"〜といえども":{"m":"🦊","t":"Iggy","mt":"👑 即使是國王也…！","cn":"中文說「即使…也…」。","br":"「といえども」是「就算你很厲害也一樣」！専門家といえども間違う=即使是專家也會犯錯。","tp":"💡 といえども=就算是…也一樣！","th":"jp"},"〜なりに":{"m":"🦊","t":"Iggy","mt":"💪 用自己的方式！","cn":"中文說「以自己的方式」。","br":"「なりに」是肯定每個人有自己的做法！子供なりに考える=用小孩自己的方式思考。帶著溫暖的包容感！","tp":"💡 なりに=用自己的方式努力！","th":"jp"},"〜んがため":{"m":"🦊","t":"Iggy","mt":"⚔️ 為了…拼了！","cn":"中文說「為了…」（非常正式）。","br":"「んがため」是超級正式的「為了」！像古代武士出征前說的話，非常有氣勢和決心。","tp":"💡 んがため=為了…拼了！（超正式）","th":"jp"},"〜に至るまで":{"m":"🦊","t":"Iggy","mt":"📏 從頭到尾都包！","cn":"中文說「從…到…」「甚至連…都…」。","br":"「に至るまで」是範圍超級廣！子供から大人に至るまで=從小孩到大人全都包。","tp":"💡 に至るまで=一路到…全包！","th":"jp"},"〜や否や":{"m":"🦊","t":"Iggy","mt":"⚡ 瞬間發生！","cn":"中文說「一…就立刻…」。","br":"「や否や」比「なり」更戲劇化！ベルが鳴るや否や飛び出した=鈴聲一響就飛出去了。","tp":"💡 や否や=一發生就立刻！（電影感）","th":"jp"},"〜つつ（も）":{"m":"🦊","t":"Iggy","mt":"😖 明知道不好還是做！","cn":"中文說「雖然知道…但還是…」。","br":"「つつも」是內心的矛盾！体に悪いと知りつつも吸う=知道不好還是抽菸。充滿「我也很無奈」的感覺。","tp":"💡 つつも=知道不好但還是…！","th":"jp"},"〜ものの":{"m":"🦊","t":"Iggy","mt":"🔄 雖然是這樣但是…","cn":"中文說「雖然…但是…」。","br":"「ものの」是期待落空！買ったものの使っていない=雖然買了但沒在用。帶著失望和反差的感覺。","tp":"💡 ものの=雖然…但結果卻…！","th":"jp"},"〜からこそ":{"m":"🦊","t":"Iggy","mt":"💎 正是因為…才…！","cn":"中文說「正是因為…所以才…」。","br":"「からこそ」是強調原因！愛しているからこそ厳しい=正是因為愛你才嚴格。強調最重要的原因！","tp":"💡 からこそ=正是因為…才！","th":"jp"},"〜にすぎない":{"m":"🦊","t":"Iggy","mt":"🤏 只不過是…而已！","cn":"中文說「只不過…而已」。","br":"「にすぎない」是把事情縮小！推測にすぎない=只不過是猜測而已。其實沒什麼了不起！","tp":"💡 にすぎない=只不過…而已！","th":"jp"},"〜にほかならない":{"m":"🦊","t":"Iggy","mt":"🎯 就是這個沒別的！","cn":"中文說「正是…」「不外乎就是…」。","br":"「にほかならない」是100%確定！努力の結果にほかならない=就是努力的結果，沒有別的解釋。","tp":"💡 にほかならない=就是這個沒錯！","th":"jp"},"〜をめぐって":{"m":"🦊","t":"Iggy","mt":"🔄 大家圍著這個話題吵！","cn":"中文說「圍繞著…」「關於…」。","br":"「をめぐって」像大家圍著桌子討論！環境問題をめぐって議論=圍繞著環境問題在討論。","tp":"💡 をめぐって=圍繞著…在爭論！","th":"jp"},"〜に相違ない":{"m":"🦊","t":"Iggy","mt":"💯 絕對沒錯！","cn":"中文說「一定是…」「毫無疑問…」。","br":"「に相違ない」是超級有自信的判斷！これは本物に相違ない＝這肯定是真品。彼が犯人に相違ない＝他一定是犯人。比「に違いない」更正式，像法官在法庭上做判決一樣嚴肅！","tp":"💡 に相違ない＝絕對是…沒錯！","th":"jp"},"〜極まりない":{"m":"🦊","t":"Iggy","mt":"💥 到了極點！","cn":"中文說「…到了極點」「非常…」。","br":"「極まりない」是把形容詞開到最大！失礼極まりない=失禮到了極點。像音量旋鈕轉到爆表！","tp":"💡 極まりない=…到了極點！超級…！","th":"jp"},"〜を皮切りに":{"m":"🦊","t":"Iggy","mt":"🎬 從這裡開始連鎖反應！","cn":"中文說「以…為開端」。","br":"「を皮切りに」像推倒第一張骨牌！東京を皮切りに全国ツアー=以東京為起點展開全國巡迴。","tp":"💡 を皮切りに=從這裡開始連鎖！","th":"jp"},"〜べからず":{"m":"🦊","t":"Iggy","mt":"🚫 古代的禁止令！","cn":"中文說「不可以…」「禁止…」。","br":"「べからず」是很古老的禁止說法！ここに入るべからず=禁止進入。像古代城堡的警告牌！","tp":"💡 べからず=禁止！（古代感）","th":"jp"},"疑問句":{"m":"🦊","t":"Iggy","mt":"❓ 句尾加「か」就變問句！","cn":"中文在句尾加「嗎」就變問句。這是書嗎？","br":"日文比英文簡單太多！不管什麼問句，只要在最後面加一個「か」就搞定了！これは本ですか＝這是書嗎？猫が好きですか＝喜歡貓嗎？明日行きますか＝明天去嗎？不用像英文分 Do/Is，「か」一招通吃！","tp":"💡 日文的「か」＝萬能問號！什麼問句都加「か」！","th":"jp"},"形容詞述語":{"m":"🦊","t":"Iggy","mt":"🎨 形容詞會變身！","cn":"中文形容詞不會變：很冷、不冷，「冷」都長一樣。","br":"日文的形容詞會變身！寒い→寒くない→寒かった。尾巴會變來變去！分「い形容詞」和「な形容詞」兩家人。","tp":"💡 い形容詞和な形容詞的變身規則不同！","th":"jp"},"Present Simple":{"m":"🦊","t":"Iggy","mt":"📦 日文現在式和未來式長一樣！","cn":"中文的「吃」不管現在還是未來都一樣。","br":"日文也是！「食べます」可以是「現在吃」也可以是「以後會吃」。一個「ます」就搞定！","tp":"💡 ます=現在做 或 以後會做！","th":"jp"},"Articles":{"m":"🦊","t":"Iggy","mt":"🎉 日文不需要冠詞！","cn":"中文沒有 a/the 的概念。","br":"好消息！日文也沒有冠詞！不用像英文煩惱「要穿 a 還是 the」。日文說「猫」就是「猫」！","tp":"💡 日文跟中文一樣不用冠詞！","th":"jp"},"Can":{"m":"🦊","t":"Iggy","mt":"💪 動詞變身就變成「會」！","cn":"中文加「會」就好：我會游泳。","br":"日文的「會」要讓動詞變身！泳ぐ→泳げる=會游泳。動詞自己穿上「能力裝」就代表「會」了！","tp":"💡 日文動詞自己變身=我會！","th":"jp"},"Be Adj":{"m":"🦊","t":"Iggy","mt":"🎨 日文形容詞自己就能當結尾！","cn":"中文直接說「很大」，不用動詞。","br":"日文的形容詞也可以自己當句子結尾！大きいです=很大。日文的「です」只是讓語氣更禮貌！","tp":"💡 日文形容詞+です=完成！","th":"jp"},"This Is":{"m":"🦊","t":"Iggy","mt":"👉 これ/それ/あれ 三兄弟！","cn":"中文用「這」「那」兩個就夠了。","br":"日文有三兄弟！これ=在我手邊的，それ=在你旁邊的，あれ=離我們都遠的。比中文多一個！","tp":"💡 これ(我的)、それ(你的)、あれ(遠的)！","th":"jp"},"Question":{"m":"🦊","t":"Iggy","mt":"❓ 句尾加「か」就好！","cn":"中文加「嗎」就變問句。","br":"日文跟中文很像！只要在最後面加「か」就變問句。比英文簡單多了，不用分 Do 還是 Is！","tp":"💡 か＝日文版的「嗎」！","th":"jp"},"Want To":{"m":"🦊","t":"Iggy","mt":"🌟 動詞穿上「たい」的願望衣！","cn":"中文說「想要吃」就好。","br":"日文的「想要」是讓動詞穿上「たい」的願望衣服！食べる→食べたい=想吃。行く→行きたい=想去。","tp":"💡 動詞+たい=想要做！","th":"jp"},"There Is":{"m":"🦊","t":"Iggy","mt":"🐱 います vs あります 又來了！","cn":"中文不管什麼都說「有」。","br":"日文的「有」分兩種！猫がいます=有貓（會動的），本があります=有書（不會動的）。","tp":"💡 會動→います，不會動→あります！","th":"jp"},"Negative":{"m":"🦊","t":"Iggy","mt":"✋ 動詞脫掉「ます」換穿「ません」！","cn":"中文在前面加「不」就好。","br":"日文的否定是讓動詞換衣服！食べます→食べません。把「ます」脫掉，換穿「ません」的否定外套！","tp":"💡 ます→ません=不！","th":"jp"},"Imperative":{"m":"🦊","t":"Iggy","mt":"🙏 日文命令要看對象！","cn":"中文直接說「開門！」就好。","br":"日文命令要看關係！對朋友用「て形」：ドアを開けて。加「ください」更客氣：開けてください。","tp":"💡 て+ください=有禮貌地拜託！","th":"jp"},"Past Tense":{"m":"🦊","t":"Iggy","mt":"⏰ ます→ました 就回到過去！","cn":"中文加「了」就好。","br":"日文也是換衣服！食べます→食べました。比英文簡單，不會有 eat→ate 那種亂變身！","tp":"💡 ます→ました=過去的事！","th":"jp"},"Future Tense":{"m":"🦊","t":"Iggy","mt":"📦 日文不分現在和未來！","cn":"中文加「會」或「要」表示未來。","br":"日文的好消息！「食べます」可以是「現在吃」也可以是「以後吃」。不用另外請 will 幫忙！","tp":"💡 ます就包含了現在和未來！","th":"jp"},"Present Continuous":{"m":"🦊","t":"Iggy","mt":"⏳ ている 又出現了！","cn":"中文加「正在」就好。","br":"日文用「ている」表示正在做！食べている=正在吃。但ている是雙面魔法，也可以表示狀態！","tp":"💡 ている=正在做 或 一直是那樣！","th":"jp"},"Passive":{"m":"🦊","t":"Iggy","mt":"😱 「被」有兩種心情！","cn":"中文的「被」不帶感情：被稱讚（開心）、被罵（難過），都用同一個「被」。英文 was eaten 也只是客觀描述。","br":"日文的「被」（られる）好壞都能用，但有一個中文英文都沒有的獨門絕技：「迷惑受身」！😊 普通被動：先生に褒められた＝被老師稱讚了（跟中文一樣）。😤 迷惑受身（日文獨有！）：ケーキを食べられた＝蛋糕被吃了。英文說 My cake was eaten 只是講事實；但日文這句話，動詞本身就自帶「我是受害者、我超不爽」的語氣！不用另外加字，光聽動詞形式就知道說話的人很生氣。這是中文和英文都做不到的！","tp":"💡 迷惑受身＝日文獨有！動詞本身就自帶「我好倒霉」的心情，中文英文都沒有這招！","th":"jp"},"Comparative":{"m":"🦊","t":"Iggy","mt":"📏 日文用「より」來比較！","cn":"中文用「比」：她比我高。","br":"日文用「より」！彼女は私より背が高い=她比我高。比英文簡單，不用記 er 或 more！","tp":"💡 AはBより=A比B！","th":"jp"},"Relative":{"m":"🦊","t":"Iggy","mt":"🎨 形容的話全塞在前面！","cn":"中文跟日文一樣把形容的話放前面：「跑步的男孩」。","br":"日文的關係子句跟中文一樣放在前面！走っている男の子=正在跑步的男孩。但英文用 who 放後面。這一點日文跟中文是好朋友！","tp":"💡 日文跟中文一樣放前面，英文用 who 放後面！","th":"jp"},"Conditional":{"m":"🦊","t":"Iggy","mt":"🌧️ 「如果」有四件外套！","cn":"中文只有一種「如果」。","br":"日文的「如果」有四件外套！「たら」最萬用、「ば」正式、「と」自然規律、「なら」聽說的。","tp":"💡 不確定就穿「たら」最安全！","th":"jp"},"主語省略":{"m":"🦊","t":"Iggy","mt":"👻 主角可以隱身！","cn":"中文口語偶爾省主語（吃飯了嗎？），但書面語通常會寫「你」「我」。","br":"日文的主角超愛隱身！只要前後文聽得懂是誰，「私は」就可以不說。嬉しいです＝（我）好開心。食べますか＝（你）要吃嗎？不說反而更自然！硬要說「私は」有時候會讓日本人覺得你在強調自己，像是在說「就是我！」","tp":"💡 日文的主角愛隱身，不說比說更自然！英文絕對不能省！","th":"jp"},"語尾決定":{"m":"🦊","t":"Iggy","mt":"🎰 意思藏在最後一個字！","cn":"中文在句子中間就能聽出「不」「了」「想」：我『不』吃、我吃『了』、我『想』吃。","br":"日文像拉霸機！要轉到最後一格才知道結果！食べ…ます（吃）？ません（不吃）？ました（吃了）？たい（想吃）？同一個開頭，最後一個字完全改變意思！所以聽日文千萬不要只聽前面就猜意思，一定要聽到最後！","tp":"💡 日文要聽到最後一個字才知道是要還是不要！","th":"jp"},"曖昧拒絕":{"m":"🦊","t":"Iggy","mt":"🌫️ 不說「不要」也是在說「不要」！","cn":"中文拒絕：「不用了謝謝」「不行」比較直接。","br":"日文幾乎不說「不要(いいえ)」！想拒絕的時候會說：ちょっと…（有點…）→ 其實是「不行」。考えさせてください（讓我考慮）→ 其實是「不要」。それはちょっと…（那個嘛…）→ 話沒說完就是在拒絕。如果日本人這樣對你說，不要真的回去等他考慮！","tp":"💡 日文的「讓我考慮」＝「不要」！話說一半就是在拒絕！","th":"jp"},"內外意識":{"m":"🦊","t":"Iggy","mt":"🏠 自己人和外人要用不同的說法！","cn":"中文不會因為聽眾是誰就改變怎麼稱呼自己的老闆。不管對誰都說「我們老闆」。","br":"日文有「內」和「外」的觀念！對外人提到自己公司的社長，要用謙讓語壓低社長：社長は外出しております。即使社長是你的大老闆，對外人說的時候也要把他壓低！因為社長是「自己人」，外人面前不能抬高自己人。中文和英文完全沒有這個規則！","tp":"💡 對外人說自己人的事，要用謙讓語壓低自己人！","th":"jp"},"男女用語":{"m":"🦊","t":"Iggy","mt":"👦👧 男生女生說話的尾巴不一樣！","cn":"中文男女說話方式幾乎一樣，沒有「男性專用」或「女性專用」的語尾詞。","br":"日文男女說話的尾巴完全不同！女生說：すごいわね！知ってるの？（用わ/の/のよ），男生說：すごいぞ！知ってるか？（用ぞ/ぜ/か）。男生用女生的語尾會被覺得很娘，女生用男生的語尾會被覺得很粗魯。動畫裡聽角色說話的尾巴就能判斷是男是女！","tp":"💡 わ/のよ＝女生尾巴，ぞ/ぜ＝男生尾巴！","th":"jp"},"擬聲擬態語":{"m":"🦊","t":"Iggy","mt":"🎵 日文有上千種聲音和感覺的專用詞！","cn":"中文有一些擬聲詞（嘩啦、噗通、嘻嘻），但數量有限。","br":"日文的擬聲擬態語（オノマトペ）超級豐富！不只描述聲音，還能描述看不見的感覺：ドキドキ（心跳加速/緊張）、ワクワク（興奮期待）、ニコニコ（笑嘻嘻）、ジメジメ（潮濕黏膩）、ザーザー（大雨嘩啦啦）。有上千個！而且加上「する」就變成動詞：ドキドキする＝心跳加速。","tp":"💡 日文用兩個重複的音就能描述任何感覺！オノマトペ超過1000個！","th":"jp"},"空氣閱讀":{"m":"🦊","t":"Iggy","mt":"💨 要讀懂空氣中沒說出來的話！","cn":"中文的拒絕比日文直接。「不用了」「我不要」中文人一聽就懂。","br":"日文有一個超重要的文化概念：空気を読む（讀空氣）！很多話不會直接說出來，要你自己感覺。もう少し検討します（再考慮一下）＝不買。そろそろ失礼します（差不多該告辭了）＝我想走了。お気持ちだけで十分です（心意就夠了）＝不要。それはどうでしょうか（那個怎麼樣呢）＝我覺得你錯了。","tp":"💡 日文的「再考慮」＝不買，「心意就夠」＝不要！要聽弦外之音！","th":"jp"},"現在完成式":{"m":"🦊","t":"Iggy","th":"jp","mt":"⏰ 日文不分「已完成」和「過去」！","cn":"中文用「已經…了」，不分是剛做完還是過去做的。我們已經更新了軟體。","br":"日文沒有完成式！「更新しました」就是過去式，已經包含了「已完成」的意思。不用像英文分「did」和「have done」。日文靠「もう（已經）」或「まだ（還沒）」來補充完成的語感！","tp":"💡 日文過去式就包含了「已完成」，加もう更清楚！"},"過去完成式":{"m":"🦊","t":"Iggy","th":"jp","mt":"⏪ 日文用 ていました 表示「那時已經是那樣」！","cn":"中文用「已經…了」不分是什麼時候完成的。我到達時，會議已經開始了。","br":"日文用「ていました」表示在過去某個時間點已經是那個狀態：始まっていました＝那時已經開始了。不像英文要分兩層過去（had + V-pp），日文靠ている的過去式就搞定！","tp":"💡 ていました＝那個時候已經是那個狀態了！"},"分詞構句":{"m":"🦊","t":"Iggy","th":"jp","mt":"🔗 日文用 て形 或 ので 完整接就好！","cn":"中文用「因為想…」完整說理由。因為想省錢，湯姆走路上班。","br":"日文不用像英文縮成分詞構句！日文用ので（原因）、て形（連接）、前に/後に（時間）就能很自然地接兩個句子。お金を節約したいので、歩いて通勤しています。完整清楚！","tp":"💡 日文用ので、て形完整說就好，不用像英文縮成 V-ing！"},"連接詞 vs 介係詞":{"m":"🦊","t":"Iggy","th":"jp","mt":"🚂 日文的接續詞不像英文分那麼細！","cn":"中文「雖然」後面接什麼都可以。雖然下雨了，活動還是很成功。","br":"日文的 にもかかわらず 後面接名詞或句子都行！のに、けど、ても 都很靈活，不像英文要分「Although（接句子）」和「Despite（只能接名詞）」。日文學起來比英文簡單！","tp":"💡 日文的連接詞比較自由，不用像英文分名詞版和句子版！"},"倒裝句":{"m":"🦊","t":"Iggy","th":"jp","mt":"🔀 日文不用倒裝，動詞永遠在最後！","cn":"中文「從來沒有見過」放在動詞前面，語序不變。我從來沒有見過這麼好的產品。","br":"日文不管怎麼強調，動詞永遠站在最後！こんなに良い製品は見たことがありません。不用像英文為了強調把 Never 搬到前面然後搞倒裝。日文的語序很穩定！","tp":"💡 日文動詞永遠站最後，不用倒裝！"},"假設語氣":{"m":"🦊","t":"Iggy","th":"jp","mt":"🔮 日文用 たら 和 のに 就搞定假設！","cn":"中文「如果…就…」動詞不用變。如果我是經理，我會雇用他。","br":"日文的假設很直覺！用 なら（如果是…）或 たら（如果做了…）就好。もし私がマネージャーなら、彼を雇うでしょう。不用像英文煩惱「用 were 還是 was」「用 would 還是 will」！","tp":"💡 日文用 なら/たら 假設，不用像英文改動詞時態！"}};
const EK={"基本句型 SVO/SOV":{"m":"🐸","t":"Yoyo","mt":"🎯 英文排隊跟中文很像！","cn":"中文的排隊順序：誰→做什麼→什麼東西。我 去 學校。我 問 老師。","br":"好消息！英文排隊跟中文幾乎一樣！I go to school＝我去學校。但如果是「去」一個地方，要請「to」帶路。I ask the teacher＝我問老師。I eat apples＝我吃蘋果。動作直接碰到東西不用 to，移動到地方才用 to 帶路！","tp":"💡 直接碰到的不用 to！移動到某地方才用 to！","th":"en"},"存在句":{"m":"🐸","t":"Yoyo","mt":"👻 There 是佔位子的小幽靈！","cn":"中文直接說「有」就好。","br":"英文不能直接說有！要先派幽靈 There 佔位子，再請 is 或 are 幫忙。There is a book=有一本書。","tp":"💡 一個配 is，很多配 are！","th":"en"},"疑問句":{"m":"🐸","t":"Yoyo","mt":"🔄 問問題要派敲門員衝到最前面！","cn":"中文問問題超簡單：加「嗎」就好。這是書嗎？你喜歡嗎？","br":"英文問問題要派「敲門員」衝到最前面！敲門員有兩隊：🔵 身分狀態問句→派 Is/Are：Is this a book?＝這是書嗎？Are you going?＝你要去嗎？🟢 動作問句→派 Do/Does：Do you like cats?＝你喜歡貓嗎？選哪隊？講身分狀態用 Is/Are，有動作用 Do！","tp":"💡 講身分狀態→Is/Are 敲門；有動作→Do/Does 敲門！","th":"en"},"被動語態":{"m":"🐸","t":"Yoyo","mt":"🎭 故事換人來說！","cn":"中文加「被」就好：我被稱讚了。蛋糕被吃了。","br":"英文的被動就是換角度講故事！本來：The teacher praised me.（老師稱讚了我）→ 換成：I was praised by the teacher.（我被老師稱讚了）。規則：主角 + was/is + 動作穿特殊衣服 + by 誰做的。英文的被動不分好壞，單純換角度說故事！","tp":"💡 主角 + was/is + 動作特殊衣服 + by 誰＝被動！","th":"en"},"條件句":{"m":"🐸","t":"Yoyo","mt":"🔮 If 是預言水晶球！","cn":"中文「如果…就…」動作都不變。","br":"If 是水晶球！看水晶球用現在樣子（If it rains），預言結果用 will（I will stay）。不能搞混！","tp":"💡 If 後面用現在樣子，結果用 will！","th":"en"},"進行式/持續態":{"m":"🐸","t":"Yoyo","mt":"📸 幫動作拍「正在做」的照片！","cn":"中文加「正在」就好。","br":"英文要底座(am/is/are)+動作穿-ing衣服。I am eating=正在吃。少了就拍不成！","tp":"💡 am/is/are+動作加ing=正在做！","th":"en"},"修飾語/連體":{"m":"🐸","t":"Yoyo","mt":"👈👉 形容的話要站哪邊？","cn":"中文和日文都放前面：「教日語的老師」「跑步的人」。","br":"英文的規則不是看長短，而是看「有沒有動作句子」！👈 一個字的形容→放前面：a big dog（大狗）、a broken window（壞掉的窗戶）。👉 有動作的句子→用 who/that 放後面：A teacher who teaches Japanese＝教日語的老師。A cake that Mom baked＝媽媽烤的蛋糕。A person who runs＝跑步的人。為什麼？因為英文不能把一整句話塞在名詞前面！只有一個字可以站前面，有動作的句子一定要站後面用 who/that 連接。中文日文都能把整句塞前面，英文不行！","tp":"💡 一個字→放前面！有動作的句子→用 who/that 放後面！","th":"en"},"形容詞述語":{"m":"🐸","t":"Yoyo","mt":"🤝 形容詞不能單獨出場！","cn":"中文直接說「很冷」就好。","br":"英文形容詞很害羞！一定要找 is/am/are 牽手：It is cold=很冷。沒有is就不成句子！","tp":"💡 形容詞前面一定要有 is/am/are！","th":"en"},"Articles":{"m":"🐸","t":"Yoyo","mt":"👕 東西出門要穿外套！","cn":"中文直接說「一顆蘋果」就好。","br":"⚠️ 死亡陷阱：a/an/the 用錯或忘記加，外國人一聽就知道！\n❌ I am student ← 少了 a！\n⭕ I am a student\n❌ I ate a breakfast ← breakfast 不加 a！\n⭕ I ate breakfast\n\n致命規則：\n可數名詞單數一定要穿外套（a/the），裸體出門是錯的！\n三餐（breakfast/lunch/dinner）不穿外套\n運動（soccer/tennis）不穿外套\na＝第一次見面 / the＝你知道我在說哪個\n母音開頭用 an：an apple, an hour（h 不發音）","tp":"💡 可數名詞單數裸體出門是錯的！一定要穿 a 或 the！三餐和運動例外！","th":"en"},"Present Simple":{"m":"🐸","t":"Yoyo","mt":"👑 He 和 She 是霸道國王！","cn":"中文不管誰，動作都一樣。","br":"⚠️ 死亡陷阱：第三人稱忘記加 s 是英文最常犯的錯！\n❌ She like cats ← 少了 s！\n⭕ She likes cats\n❌ He go to school ← 少了 es！\n⭕ He goes to school\n\nHe/She/It 是霸道國王，後面的動作一定要穿 s 制服！\nI like / You like / We like → 都不用加\nHe likeS / She likeS / It likeS → 一定要加！\n\n特殊變化：go→goes, do→does, have→has, study→studies","tp":"💡 He/She/It 後面動詞一定加 s！少了 s 是英文最常犯的錯！","th":"en"},"Past Tense":{"m":"🐸","t":"Yoyo","mt":"⏰ 動作坐時光機回到過去！","cn":"中文加「了」就好，動作不變。","br":"⚠️ 死亡陷阱：不規則動詞只能硬背，沒有規則！\n❌ I goed to school ← go 不能加 ed！\n⭕ I went to school\n❌ I eated lunch ← eat 不能加 ed！\n⭕ I ate lunch\n\n最常錯的不規則動詞：\ngo→went, eat→ate, see→saw, come→came\nbuy→bought, think→thought, teach→taught\nrun→ran, swim→swam, drink→drank\nput→put, cut→cut, read→read（長得一樣但發音不同！）\n\n否定句和問句動詞要變回原形：\n❌ Did you went? → ⭕ Did you go?","tp":"💡 go→went, eat→ate 只能背！Did 出場後動詞要脫回原形！","th":"en"},"Question":{"m":"🐸","t":"Yoyo","mt":"🔄 問問題要派敲門員衝到最前面！","cn":"中文問問題加「嗎」就好。","br":"⚠️ 死亡陷阱：問句要派敲門員，但敲門員派錯就全錯！\n❌ You like cats? ← 英文不能只加問號！\n⭕ Do you like cats?\n❌ Does she likes cats? ← likes 多了 s！\n⭕ Does she like cats?\n\n致命選擇：派哪個敲門員？\n有動作 → Do/Does：Do you play? Does he eat?\n身份狀態 → Is/Are：Is he a student? Are you happy?\n❌ Do you are happy? ← Do 和 Are 不能同時出場！\n⭕ Are you happy?","tp":"💡 Do/Does 和 Is/Are 不能同時出場！有動作用 Do，講狀態用 Is/Are！","th":"en"},"Negative":{"m":"🐸","t":"Yoyo","mt":"🛑 don't 是交通紅燈！","cn":"中文加「不」就好。","br":"⚠️ 死亡陷阱：doesn't 後面動詞不能加 s！\n❌ She doesn't likes cats ← s 多了！\n⭕ She doesn't like cats\n❌ She don't like cats ← She 要用 doesn't！\n⭕ She doesn't like cats\n\n規則：紅燈（don't/doesn't）出現後，動詞脫掉所有變裝回原形！\ndoesn't 已經代替動詞承擔了第三人稱的 s，動詞不用再加。\nHe/She/It → doesn't + 原形\nI/You/We/They → don't + 原形","tp":"💡 doesn't 後面動詞一定是原形！s 不能出現兩次！","th":"en"},"Comparative":{"m":"🐸","t":"Yoyo","mt":"📏 比高矮要長尾巴！","cn":"中文用「比」就好。","br":"短的形容詞長「er」尾巴：tall→taller。長的請「more」幫忙：more beautiful！","tp":"💡 短的加 er，長的請 more！","th":"en"},"Conditional":{"m":"🐸","t":"Yoyo","mt":"🔮 If 是預言水晶球！","cn":"中文「如果…就…」不用變。","br":"If 是水晶球！看球用現在樣子，結果用 will。前後不能搞混！","tp":"💡 If 用現在樣子，結果用 will！","th":"en"},"Passive":{"m":"🐸","t":"Yoyo","mt":"🎭 故事換人來說！","cn":"中文加「被」就好：我被稱讚了。蛋糕被吃了。","br":"英文的被動就是換角度講故事！本來：The teacher praised me.（老師稱讚了我）→ 換成：I was praised by the teacher.（我被老師稱讚了）。規則：主角 + was/is + 動作穿特殊衣服 + by 誰做的。英文的被動不分好壞，單純換角度說故事！","tp":"💡 主角 + was/is + 動作特殊衣服 + by 誰＝被動！","th":"en"},"Can":{"m":"🐸","t":"Yoyo","mt":"💪 can 是超能力徽章！","cn":"中文直接說「會」就好：我會游泳。","br":"英文的「會」要請出 can 這個超能力徽章！I can swim。把 can 掛在動作前面，動作不用變身！","tp":"💡 can+動作原本的樣子=我會！","th":"en"},"Be Adj":{"m":"🐸","t":"Yoyo","mt":"🤝 形容詞要找 is 牽手！","cn":"中文直接說「很大」就好。","br":"英文的形容詞很害羞！一定要找 is/am/are 來牽手：It is big=它很大。沒有 is 就不會演！","tp":"💡 is/am/are+形容詞=怎麼樣！","th":"en"},"This Is":{"m":"🐸","t":"Yoyo","mt":"👉 This/That 是手指頭！","cn":"中文直接說「這是狗」就好。","br":"英文用 This（手指近的）和 That（手指遠的）。This is a dog=這是一隻狗。記得狗要穿 a 外套！","tp":"💡 近的用 This，遠的用 That！","th":"en"},"Want To":{"m":"🐸","t":"Yoyo","mt":"🌟 want to 是許願魔法！","cn":"中文直接說「我想要吃」就好。","br":"英文的「想要」要用 want to 許願咒語！I want to eat=我想要吃。口語常縮短成 wanna！","tp":"💡 want to+動作=我想要做！","th":"en"},"There Is":{"m":"🐸","t":"Yoyo","mt":"👻 There 是佔位子的小幽靈！","cn":"中文直接說「有一隻貓」就好。","br":"英文不能直接說「有」！要派幽靈 There 佔位子：There is a cat=有一隻貓。幽靈本身沒意思！","tp":"💡 一個用 There is，很多用 There are！","th":"en"},"Imperative":{"m":"🐸","t":"Yoyo","mt":"📢 命令句直接喊動作！","cn":"中文：「開門！」「不要跑！」直接說。","br":"英文命令也很直接！動作放第一：Open the door! 要說不要加 Don't：Don't run! 不用說「你」！","tp":"💡 動作放最前面=命令！Don't=不要！","th":"en"},"Future Tense":{"m":"🐸","t":"Yoyo","mt":"🚀 will 是火箭飛向未來！","cn":"中文加「會」就代表未來。","br":"英文要坐火箭去未來！在動作前加 will：He will go=他會去。will 後面動作保持原樣！","tp":"💡 will+動作原本的樣子=未來會！","th":"en"},"Present Continuous":{"m":"🐸","t":"Yoyo","mt":"📸 am/is/are+ing=正在拍照！","cn":"中文加「正在」就好。","br":"英文要底座(am/is/are)+動作穿-ing衣服。I am eating=正在吃。She is reading=她正在讀。","tp":"💡 am/is/are+動作加ing=正在！","th":"en"},"Relative":{"m":"🐸","t":"Yoyo","mt":"📎 who/that 是迴紋針！","cn":"中文：「跑步的男孩是 Tom」放前面。","br":"英文用 who 或 that 當迴紋針夾兩句話！The boy who runs is Tom。who 後面就是在形容前面那個人！","tp":"💡 who=用來形容「人」的迴紋針！","th":"en"},"主語省略":{"m":"🐸","t":"Yoyo","mt":"🚫 英文的主角絕對不能消失！","cn":"中文口語常省主語：（你）吃飯了嗎？（我）知道了。","br":"英文的主角絕對不能省略！每句話都必須有 I/You/He/She/It/We/They。日文可以說「嬉しい」就好，但英文一定要說「I am happy」。少了 I 就不是完整的句子！這是英文和日文最大的差異之一。","tp":"💡 英文每句話一定要有主角！I/You/He/She 不能省！","th":"en"},"語尾決定":{"m":"🐸","t":"Yoyo","mt":"🔧 英文的變化在句子中間！","cn":"中文在中間加「不」「了」「想」就好。","br":"英文的變化在句子中間，不像日文要等到最後！否定：I don't eat（don't 在中間）。過去式：I ate（動詞自己變形）。想要：I want to eat（want 在中間）。英文聽到中間就知道意思了，不用等到最後。","tp":"💡 英文的否定/過去/想要都在句子中間就能聽出來！","th":"en"},"曖昧拒絕":{"m":"🐸","t":"Yoyo","mt":"🗣️ 英文比較直接說！","cn":"中文的拒絕：「不用了謝謝」「再看看」算中間程度。","br":"英文拒絕通常比日文直接！No thanks = 不用了。I can't = 我不行。I'm not interested = 我沒興趣。英文也有委婉的說法（I'll think about it），但比起日文的ちょっと…（話說一半），英文算是蠻直接的。不用像日文那樣猜半天！","tp":"💡 英文 No thanks 就是不要！不用猜弦外之音！","th":"en"},"內外意識":{"m":"🐸","t":"Yoyo","mt":"😌 英文不分內外！","cn":"中文也不太分內外。","br":"英文完全沒有「內外意識」！不管對誰說話，Our president 就是 Our president，不會因為聽眾是客戶就改變說法。英文只有禮貌程度的差別（Could you vs Can you），沒有像日文那樣要壓低自己人的規則。學英文不用煩惱這個！","tp":"💡 英文不用分內外，Our boss 對誰都一樣說！","th":"en"},"男女用語":{"m":"🐸","t":"Yoyo","mt":"🟰 英文男女說法一樣！","cn":"中文男女說話也幾乎一樣。","br":"英文男女說話方式幾乎完全一樣！That's amazing! 不管男生女生都這樣說。沒有什麼「男生專用」或「女生專用」的語尾詞。這一點英文比日文簡單太多了！日文要記一堆男女不同的尾巴，英文完全不用煩惱。","tp":"💡 英文男女說法完全一樣！不用記不同的尾巴！","th":"en"},"擬聲擬態語":{"m":"🐸","t":"Yoyo","mt":"📝 英文用形容詞代替聲音詞！","cn":"中文有一些擬聲詞但不多。","br":"英文的擬聲詞很少！日文有ドキドキ/ワクワク/ニコニコ/ジメジメ上千個，但英文大多用普通的形容詞代替：heart is pounding（心跳加速）、excited（興奮）、smiling（微笑）、humid（潮濕）。英文偶爾也有 boom/splash/buzz 這類擬聲詞，但數量遠遠不及日文。","tp":"💡 英文用 excited/pounding 這些形容詞代替日文的オノマトペ！","th":"en"},"空氣閱讀":{"m":"🐸","t":"Yoyo","mt":"🗣️ 英文說話比較直接！","cn":"中文的直接程度在日文和英文之間。","br":"英文比日文直接很多！No thanks = 不要。I should get going = 我要走了。I'll pass = 我不要。英文也有客氣的說法，但通常對方聽得懂你的意思，不用像日文那樣猜「他說讓我考慮到底是真的在考慮還是在拒絕？」","tp":"💡 英文比較直接，No thanks 就是不要！","th":"en"},"助詞導航":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文靠位置排隊，不用貼名牌！","cn":"中文跟英文一樣，靠「誰先說」就知道誰做什麼。我吃蘋果＝I eat apples。","br":"日文每個字後面都要貼名牌（は、を、に），才知道誰是誰。但英文不用！英文靠排隊位置就知道了。排第一的是「做事的人」，排在動作後面的是「被處理的東西」。I eat apples＝「I」排第一所以是主角，「apples」排在動作後面所以是被吃的。不用貼標籤，位置就是身份！","tp":"💡 英文靠位置決定身份，不需要日文的助詞名牌！"},"て形串連":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 and 串起來就好！","cn":"中文把動作排一排就好：起床，吃早餐。I wake up in the morning and eat breakfast.","br":"日文有個特別的「て形」把動作串在一起，像火車車廂一節接一節。英文簡單多了！用 and 就搞定。I wake up and eat breakfast。如果要說順序，加上 then：I wake up, then eat breakfast。不用改動詞的形狀！","tp":"💡 英文用 and 或 then 串動作，不用像日文改動詞形狀！"},"自他動詞":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文同一個字就搞定！","cn":"中文也是同一個「開」字：門開了、我開門。The door opened.","br":"日文把「自己發生的」和「有人做的」分成兩個不同的字：開く vs 開ける。英文跟中文一樣聰明，同一個字 open 就搞定！The door opened＝門自己開了。I opened the door＝我開了門。同一個字，只看有沒有人在前面做動作！","tp":"💡 英文一個 open 打天下，日文要分兩個字！"},"禮物流向":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文只有 give 和 receive，不分箭頭方向！","cn":"中文就說「給」和「收到」，不管方向。我送書給朋友。","br":"日文要看箭頭方向選三個不同的動詞（あげる/くれる/もらう），英文完全不用！\n\n我→朋友：I gave a book to my friend.（give）\n朋友→我：My friend gave me a book.（還是 give！）\n我收到：I received a book from my friend.（receive）\n\n英文不管箭頭往哪飛，送出去永遠 give，收到永遠 receive。不用像日文煩惱「誰當主角就要換動詞」！","tp":"💡 英文 give＝送（不分方向），receive＝收。兩個字打天下！"},"聚光燈 は vs が":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文不分新消息和舊消息！","cn":"中文也不分：「我是學生」不管是不是新消息，都一樣說。I am a student.","br":"日文有「は」和「が」兩個聚光燈，「は」照的是大家已經知道的，「が」照的是新發現的。英文跟中文一樣，沒有這個區別！I am a student 不管是自我介紹（舊消息）還是第一次告訴你（新消息），說法都一樣。頂多語氣不同而已！","tp":"💡 英文不管新舊消息，句子都一樣說！"},"敬語入門":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文不用變動詞來表示禮貌！","cn":"中文加「您」「請」表示禮貌，不改動詞。The teacher has already left.","br":"日文的敬語超級複雜！動詞要變形：帰る→帰られました（尊敬語）。英文不用改動詞！The teacher has already left＝老師已經走了。不管說的是老師還是朋友，動詞都是 left。英文表示禮貌靠加 please、用 could/would，不用改動詞本身！","tp":"💡 英文靠 please 和 could 表示禮貌，動詞不用變形！"},"轉述標籤 と":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 that 來轉述別人的話！","cn":"中文用「覺得」「說」就直接接內容。I think it will rain tomorrow.","br":"日文轉述別人的話要在引用內容後面貼「と」標籤：雨だと思います。英文用 that 放在前面：I think that it will rain。而且 that 常常可以省略！I think it will rain tomorrow。比日文簡單，不用記放哪裡！","tp":"💡 英文用 that 轉述，而且常常可以省略！"},"漢字陷阱":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文沒有漢字陷阱，但有拼寫陷阱！","cn":"中文的字就是中文的意思，不會搞混。I study every day.","br":"日文的漢字長得跟中文一樣，但意思可能完全不同！「勉強」中文是「勉強」，日文卻是「讀書」！英文完全沒有這個問題，因為英文用字母，不用漢字。I study every day＝我每天讀書。study 就是讀書，不會被漢字搞混！","tp":"💡 英文用字母不用漢字，不會被長得像的字騙！"},"推測 でしょう":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 probably 或 will 來猜測！","cn":"中文加「大概」「吧」表示猜測。It will probably rain tomorrow.","br":"日文在句尾加「でしょう」表示「我猜」。英文不改句尾，而是加一些「猜測小幫手」！probably＝大概、maybe＝也許、might＝可能。It will probably rain tomorrow＝明天大概會下雨。把小幫手放進句子裡就好！","tp":"💡 英文用 probably/maybe/might 表示猜測，不改句尾！"},"ように 目標":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 so (that) I can 表示目標！","cn":"中文說「為了能…」。I study every day so I can speak Japanese.","br":"日文用「ように」表示一個目標：話せるように＝為了能說。英文用 so (that) I can：I study every day so I can speak Japanese＝我每天讀書，這樣我就能說日語。也可以用 in order to：I study in order to speak Japanese。目標放在後面！","tp":"💡 英文用 so I can 表示「為了能做到某事」！"},"のに 轉折":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 even though 表示「明明…卻…」！","cn":"中文說「明明…卻…」。Even though I studied, I failed the test.","br":"日文用「のに」放在句子中間表示轉折：勉強したのに落ちた。英文用 even though 放在前面：Even though I studied, I failed the test＝明明讀了書，卻沒考過。也可以用 but 簡單連接：I studied, but I failed。","tp":"💡 英文用 even though 或 but 表示「明明…卻…」！"},"ので 原因":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 because 或 so 說原因！","cn":"中文說「因為…所以…」。It's raining, so I'll bring an umbrella.","br":"日文用「ので」接在原因後面。英文有兩種說法！because 放在原因前面：Because it's raining, I'll bring an umbrella。或者用 so 放在結果前面：It's raining, so I'll bring an umbrella。兩個方向都可以！","tp":"💡 because＝因為（放原因前），so＝所以（放結果前）！"},"ほど 程度":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 so…that 表示「到什麼程度」！","cn":"中文說「…到哭了」。It was so spicy I cried.","br":"日文用「ほど」夾在中間表示程度：泣くほど辛い＝辣到哭的程度。英文用 so…that 包起來：It was so spicy that I cried＝太辣了以至於我哭了。that 常常可以省略：It was so spicy I cried。簡單明瞭！","tp":"💡 英文用 so + 形容詞 + that 表示程度！"},"使役形":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 make 或 let 叫別人做事！","cn":"中文說「叫他去」「讓他做」。Mom made me eat vegetables.","br":"日文在動詞後面貼「させる」讓它變成「叫別人做」：食べる→食べさせる。英文不改動詞！用 make（強迫）或 let（允許）放在前面。Mom made me eat vegetables＝媽媽逼我吃蔬菜。Mom let me play＝媽媽讓我玩。make＝強迫，let＝允許！","tp":"💡 make＝強迫做，let＝允許做，不用改動詞！"},"ために 目的":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 to 或 in order to 表示目的！","cn":"中文說「為了…」。I study to get into university.","br":"日文用「ために」接在目的後面：大学に入るために勉強する。英文超簡單，用 to 就好！I study to get into university＝我讀書來考上大學。如果要更正式，用 in order to：I study in order to get into university。to 是最萬用的目的詞！","tp":"💡 英文用 to + 動詞就能表示「為了…」！"},"工具箱 で":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 by/with/in/at 分工合作！","cn":"中文用「搭」「用」「在」就搞定。I go to school by bus.","br":"日文只有一個「で」就能表示交通工具、使用工具、地點。英文要分工！搭車＝by bus，用工具＝with chopsticks，在某地＝at/in the park。I go to school by bus＝我搭公車去學校。每種用法配不同的小詞，但其實很好記！","tp":"💡 交通用 by，工具用 with，地點用 at/in！"},"使役 させる":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 make/let/have 指揮別人！","cn":"中文說「叫」「讓」「要求」。Mom made me eat vegetables.","br":"日文在動詞上貼「させる」標籤就變成「叫別人做」。英文用三個指揮官！make＝強迫（Mom made me eat），let＝允許（Mom let me go），have＝安排（Mom had me clean）。Mom made me eat vegetables＝媽媽強迫我吃蔬菜。","tp":"💡 make＝強迫，let＝允許，have＝安排！"},"〜きらいがある":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 tend to 說「有…的傾向」！","cn":"中文說「有…的傾向」「老是…」。He tends to procrastinate on everything.","br":"日文用「きらいがある」（跟「討厭」的きらい不一樣喔！）表示壞習慣的傾向。英文用 tend to：He tends to procrastinate on everything＝他什麼都老是拖延。也可以說 have a tendency to。通常講不太好的習慣！","tp":"💡 tend to＝老是…（不好的傾向）！"},"〜ずくめ":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 full of 或 nothing but 表示「盡是…」！","cn":"中文說「盡是」「全是」。This year was full of good things.","br":"日文用「ずくめ」黏在後面表示「全部都是」：良いことずくめ＝盡是好事。英文用 full of 或 nothing but：This year was full of good things＝今年盡是好事。也可以說 nothing but good things。整個被某樣東西塞滿的感覺！","tp":"💡 full of＝滿滿的都是，nothing but＝除了…什麼都沒有！"},"〜を限りに":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 as of 表示「從…起」一刀兩斷！","cn":"中文說「從今天起」「到…為止」。As of today, I quit smoking.","br":"日文用「を限りに」在某個時間點一刀切斷：今日を限りに＝從今天起。英文用 as of 或 starting from：As of today, I quit smoking＝從今天起我戒菸。這個時間點之後，一切都不一樣了！","tp":"💡 as of＝從…起，乾脆俐落的分界線！"},"〜に即して":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 based on 或 grounded in 表示「貼近」！","cn":"中文說「貼近」「根據」「符合」。Education grounded in reality is needed.","br":"日文用「に即して」表示緊貼著某個標準或現實。英文用 based on 或 grounded in：Education grounded in reality is needed＝需要貼近現實的教育。也可以說 in line with（符合）。就是不要脫離實際！","tp":"💡 grounded in＝腳踏實地的，based on＝根據！"},"〜ともなると":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 when you become 表示「到了…的地位」！","cn":"中文說「到了…的話」「身為…」。When you become a CEO, the responsibility is heavy.","br":"日文用「ともなると」表示到了某個重要身份或等級：社長ともなると＝到了社長那樣的級別。英文直接說 when you become 或 once you're：When you become a CEO, the responsibility is heavy＝當你當上社長，責任很重。","tp":"💡 when you become＝當你到了那個等級！"},"〜まじき":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 unbecoming of 表示「不該有的」！","cn":"中文說「不該有的」「不配…的」。That remark is unbecoming of a teacher.","br":"日文用「まじき」表示「身為某身份不應該做的事」：教師にあるまじき＝身為老師不該有的。英文用 unbecoming of 或 inappropriate for：That remark is unbecoming of a teacher＝那個發言不配身為老師。是很正式的批評！","tp":"💡 unbecoming of＝跟身份不相稱的，不該做的！"},"〜ずにはいられない":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 can't help but 表示「忍不住」！","cn":"中文說「忍不住」「不得不」。I can't help but cry when I watch this movie.","br":"日文用「ずにはいられない」表示怎麼忍都忍不住：泣かずにはいられない＝忍不住哭。英文用 can't help but：I can't help but cry when I watch this movie＝看這部電影忍不住哭。也可以說 can't help crying。是控制不住的感覺！","tp":"💡 can't help but＝忍不住，完全擋不住！"},"〜ざるを得ない":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 have no choice but to 表示「不得不」！","cn":"中文說「不得不」「只好」。Due to circumstances, I have no choice but to attend.","br":"日文用「ざるを得ない」表示被逼到沒辦法：参加せざるを得ない＝不得不參加。英文用 have no choice but to：I have no choice but to attend＝我不得不參加。也可以簡單說 have to 或 must。是被情況逼到牆角的感覺！","tp":"💡 have no choice but to＝被逼到只能做這件事！"},"〜にかたくない":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 it's not hard to 表示「不難想像」！","cn":"中文說「不難想像」。It's not hard to imagine the victim's suffering.","br":"日文用「にかたくない」表示「不難做到某事」：想像にかたくない＝不難想像。英文直接說 it's not hard to：It's not hard to imagine the victim's suffering＝不難想像受害者的痛苦。也可以說 it's easy to imagine。很好懂！","tp":"💡 it's not hard to＝不難做到…，想想就知道！"},"〜べく":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 in order to 表示「為了要…」！","cn":"中文說「為了」。I studied every day in order to pass.","br":"日文用「べく」是很正式的「為了要」：合格すべく＝為了合格。英文用 in order to 或簡單的 to：I studied every day in order to pass＝我為了合格每天讀書。in order to 比 to 更正式，配合「べく」的感覺剛好！","tp":"💡 in order to＝為了要…（正式版的 to）！"},"〜かたわら":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 while also 表示「一邊…一邊…」！","cn":"中文說「一邊…一邊…」。He teaches while also writing novels.","br":"日文用「かたわら」表示主業之外同時做副業：教師をするかたわら＝一邊當老師。英文用 while also：He teaches while also writing novels＝他一邊教書一邊寫小說。也可以說 in addition to teaching, he writes novels。兩件事同時進行！","tp":"💡 while also＝在做主要的事的同時，還…！"},"〜なり":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 as soon as 表示「一…就…」！","cn":"中文說「一…就…」。As soon as he got home, he fell asleep.","br":"日文用「なり」表示「一做完就馬上…」：帰るなり寝た＝一回家就睡了。英文用 as soon as：As soon as he got home, he fell asleep＝他一到家就睡了。也可以說 the moment：The moment he got home, he fell asleep。超級快速！","tp":"💡 as soon as＝一…就馬上…，零延遲！"},"〜そばから":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 as fast as 表示「才剛…就…」的無奈！","cn":"中文說「才剛…就…」。I forget things as soon as I memorize them.","br":"日文用「そばから」表示做了馬上白費：覚えたそばから忘れる＝才記住就忘了。英文用 as soon as 或 as fast as：I forget things as soon as I memorize them＝才剛記住就忘了。帶著「好無奈，一直重複」的感覺！","tp":"💡 英文用 as soon as 加上語氣表達「才剛做完就白費」的無奈！"},"〜ものを":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 if only 表示「早知道就好了」的嘆氣！","cn":"中文說「早點…就好了」帶著遺憾。If only he had said something earlier...","br":"日文用「ものを」在句尾嘆氣，表示「明明可以…偏不做」：早く言えばよかったものを＝早說就好了嘛。英文用 if only：If only he had said something earlier＝他要是早點說就好了。帶著遺憾和輕微抱怨的語氣！","tp":"💡 if only＝要是…就好了（嘆氣版）！"},"〜といえども":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 even 表示「即使是…也…」！","cn":"中文說「即使是…也…」。Even an expert can make mistakes.","br":"日文用「といえども」是很正式的「即使是」：専門家といえども＝即使是專家。英文用 even：Even an expert can make mistakes＝即使是專家也會出錯。簡單一個 even 就搞定，不用改句子結構！","tp":"💡 even＝即使是…也…，一個字就夠了！"},"〜なりに":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 in one's own way 表示「按照自己的方式」！","cn":"中文說「按照自己的方式」「以…的水準」。Children think in their own way.","br":"日文用「なりに」表示在自己能力範圍內盡力：子供なりに＝以小孩的方式。英文用 in one's own way：Children think in their own way＝小孩有小孩自己的思考方式。尊重每個人用自己的方法努力！","tp":"💡 in one's own way＝用自己的方式，按自己的程度！"},"〜んがため":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 in order to 表示「為了…」的強烈決心！","cn":"中文說「為了…」帶著很強的決心。I continued harsh training in order to win.","br":"日文用「んがため」是古典又有力的「為了」：勝たんがために＝為了勝利。英文用 in order to 加上強烈的語氣：I continued harsh training in order to win＝為了勝利我持續嚴格訓練。比普通的 to 更有決心的感覺！","tp":"💡 in order to＝為了…（帶著強烈決心版）！"},"〜に至るまで":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 from A to B 表示「從…到…全部」！","cn":"中文說「從…到…」。Everyone from children to adults can enjoy it.","br":"日文用「に至るまで」強調範圍的每一個角落：子供から大人に至るまで＝從小孩到大人每一個都包含。英文用 from…to…：Everyone from children to adults can enjoy it＝從小孩到大人每個人都能享受。簡單明瞭！","tp":"💡 from A to B＝從A到B，一個都不漏！"},"〜や否や":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 the moment 表示「一…就馬上」！","cn":"中文說「一…就…」非常迅速。The moment the bell rang, the students dashed out.","br":"日文用「や否や」表示幾乎同時發生：鳴るや否や飛び出した＝鈴聲響就衝出去了。英文用 the moment 或 as soon as：The moment the bell rang, the students dashed out＝鈴聲一響學生們就衝出去了。閃電般快速！","tp":"💡 the moment＝就在那個瞬間，馬上就…！"},"〜つつ（も）":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 despite knowing 表示「明知道…卻還是…」！","cn":"中文說「雖然知道…但還是…」。Despite knowing it's bad for my health, I still smoke.","br":"日文用「つつも」表示心裡知道不對但還是做了：悪いと知りつつ吸っている＝知道不好還在抽。英文用 despite knowing 或 even though I know：Despite knowing it's bad for my health, I still smoke＝明知對身體不好還是在抽菸。矛盾但真實！","tp":"💡 despite knowing＝明明知道…卻偏偏…！"},"〜ものの":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 but 表示「雖然…但是…」！","cn":"中文說「雖然…但是…」。I bought it, but I haven't used it once.","br":"日文用「ものの」表示「做是做了，可是…」：買ったものの使っていない＝買了卻沒用過。英文用 but 或 although：I bought it, but I haven't used it once＝我買了，但一次也沒用過。簡簡單單的 but 就能表達！","tp":"💡 but＝但是，前後落差的轉折！"},"〜からこそ":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 precisely because 強調原因！","cn":"中文說「正是因為…才…」。Precisely because I love you, I am strict.","br":"日文用「からこそ」把原因加粗加底線：好きだからこそ＝正是因為喜歡。英文用 precisely because 或 it is because：Precisely because I love you, I am strict＝正是因為愛你才嚴格。也可以說 The very reason I'm strict is that I love you。強調最核心的原因！","tp":"💡 precisely because＝正正就是因為…才…！"},"〜にすぎない":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 merely 或 just 表示「只不過是」！","cn":"中文說「只不過是」「而已」。This is merely speculation.","br":"日文用「にすぎない」把事情壓小：推測にすぎない＝只不過是推測。英文用 merely 或 just：This is merely speculation＝這只不過是推測而已。also: nothing more than。把東西說得沒什麼了不起！","tp":"💡 merely / just＝只不過是…而已，沒什麼大不了！"},"〜にほかならない":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 nothing other than 表示「正是」！","cn":"中文說「正是」「就是」。Success is nothing other than the result of effort.","br":"日文用「にほかならない」強調「就是這個，不是別的」：努力の結果にほかならない＝正是努力的結果。英文用 nothing other than 或 none other than：Success is nothing other than the result of effort＝成功正是努力的結果。用力指著說「就是它！」","tp":"💡 nothing other than＝不是別的，正正就是…！"},"〜をめぐって":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 surrounding / about 表示「圍繞著…」！","cn":"中文說「圍繞著…」「關於…」。Debate continues surrounding this issue.","br":"日文用「をめぐって」像繞圈圈一樣圍著某個話題轉：問題をめぐって＝圍繞這個問題。英文用 surrounding 或 about/over：Debate continues surrounding this issue＝圍繞這個問題的討論持續著。也可以說 about this issue。","tp":"💡 surrounding＝圍繞著某個話題轉來轉去！"},"〜に相違ない":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 undoubtedly 表示「肯定是」！","cn":"中文說「肯定是」「一定是」。This is undoubtedly genuine.","br":"日文用「に相違ない」很正式地說「沒有差異＝肯定是」：本物に相違ない＝肯定是真品。英文用 undoubtedly 或 without a doubt：This is undoubtedly genuine＝這毫無疑問是真品。也可以說 must be。超級有信心！","tp":"💡 undoubtedly＝毫無疑問地，百分之百確定！"},"〜極まりない":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 extremely 表示「…到了極點」！","cn":"中文說「…到極點」「極其…」。His attitude is extremely rude.","br":"日文用「極まりない」表示到了極端：失礼極まりない＝失禮到極點。英文用 extremely：His attitude is extremely rude＝他的態度極其無禮。也可以用 incredibly 或 utterly。就是到了最高程度，不能再多了！","tp":"💡 extremely＝極其…，已經到頂了！"},"〜を皮切りに":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 starting with 表示「以…為開端」！","cn":"中文說「以…為開端」「從…開始」。Starting with Tokyo, a national tour began.","br":"日文用「を皮切りに」像切開第一刀，後面接連展開：東京を皮切りに＝以東京為開端。英文用 starting with 或 beginning with：Starting with Tokyo, a national tour began＝以東京為開端，全國巡迴開始了。第一刀切下去，後面就停不下來！","tp":"💡 starting with＝以…為起點，然後一個接一個！"},"〜べからず":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 英文用 must not 或 do not 表示「禁止」！","cn":"中文說「禁止」「不可以」。You must not enter here.","br":"日文用「べからず」是古典的禁止令：入るべからず＝禁止進入。英文用 must not 或 do not：You must not enter here＝你不可以進入這裡。也常在告示牌上看到 Do not enter 或 No entry。嚴肅的禁止命令！","tp":"💡 must not / do not＝禁止！不准做！"},"現在完成式":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 have + 過去分詞＝到現在為止的成績單！","cn":"中文用「已經…了」。我們已經更新了軟體。","br":"⚠️ 死亡陷阱：完成式不能跟「明確的過去時間」一起用！\n❌ I have been to Japan yesterday ← yesterday 不能配 have！\n⭕ I went to Japan yesterday（過去式）\n⭕ I have been to Japan（完成式，不說什麼時候）\n\n致命規則：\nyesterday/last week/in 2020 → 只能用過去式\nsince/for/already/yet/ever → 配完成式\n❌ I have finished it last night\n⭕ I finished it last night\n⭕ I have already finished it","tp":"💡 yesterday/last week 只能配過去式！have 不能跟明確的過去時間一起用！"},"過去完成式":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 had + 過去分詞＝過去的更過去！","cn":"中文不分「過去」和「過去的更過去」。我到達時，會議已經開始了。","br":"英文有兩層過去！The meeting had started when I arrived。arrived 是過去，had started 是「更早的過去」。像時光機先停在一樓（arrived），再往地下室走（had started）。搭配 before、when、by the time 一起用。TOEIC 超愛考這個！","tp":"💡 had + V-pp＝在過去某件事之前就已經完成了！"},"分詞構句":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 V-ing / V-pp 開頭＝把句子壓縮成修飾語！","cn":"中文用「因為想…」「寫完…後」完整說。因為想省錢，湯姆走路上班。","br":"英文超愛把「因為」「之後」的句子壓縮！Wanting to save money＝因為想省錢（把 Because he wanted 壓成 Wanting）。Having finished the report＝寫完報告後（Having + V-pp＝先做完）。The report attached＝附上的報告（V-pp 放名詞後面修飾）。TOEIC 閱讀的大魔王！","tp":"💡 V-ing 開頭＝主動的原因；V-pp 放後面＝被動的修飾！"},"連接詞 vs 介係詞":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 火車頭 vs 背包客！後面接什麼決定用哪個！","cn":"中文「雖然」「因為」後面接什麼都行。雖然下雨了，活動還是很成功。","br":"⚠️ 死亡陷阱：Although 和 Despite 後面接的東西不同！\n❌ Although the rain, we went out ← the rain 是名詞，不能用 Although！\n⭕ Despite the rain, we went out（Despite + 名詞）\n⭕ Although it rained, we went out（Although + 句子）\n\n同樣的陷阱：\n❌ Because of it rained ← Because of 後面不能接句子！\n⭕ Because it rained（Because + 句子）\n⭕ Because of the rain（Because of + 名詞）\n\n口訣：看後面是句子還是名詞，就知道該選哪個！","tp":"💡 Although/Because + 句子！Despite/Due to + 名詞！後面接什麼就決定用哪個！"},"倒裝句":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 否定詞搬到句首，後面就要像問句一樣倒過來！","cn":"中文「從來沒有」放在動詞前面，語序不變。我從來沒有見過這麼好的產品。","br":"⚠️ 死亡陷阱：否定詞放句首，後面一定要倒裝！\n❌ Never I have seen ← 沒倒裝！\n⭕ Never have I seen\n❌ Not only he finished ← 沒倒裝！\n⭕ Not only did he finish\n\n需要倒裝的開頭詞：\nNever / Rarely / Seldom / Hardly\nNot only / Not until / No sooner\nOnly after / Only when\n\n倒裝方法：主詞和助動詞對調（像問句一樣）\nI have → have I\nhe did → did he","tp":"💡 Never/Not only/Only 放句首 → 後面一定像問句一樣倒裝！"},"假設語氣":{"m":"🐸","t":"Yoyo","th":"en","mt":"🎯 跟事實相反的如果，動詞要「退一步」！","cn":"中文「如果」不管真假，動詞都不變。如果我是經理，我會雇用他。","br":"⚠️ 死亡陷阱：假設語氣的 was 要變成 were！\n❌ If I was rich, I would travel ← was 是錯的！\n⭕ If I were rich, I would travel\n\n與現在相反 → 動詞退一步（現在→過去）：\nam/is → were（不是 was！全部用 were）\nhave → had\ncan → could\n\n與過去相反 → 動詞退兩步（過去→過去完成）：\n❌ If I studied harder, I would pass ← 這是與現在相反\n⭕ If I had studied harder, I would have passed ← 這才是與過去相反","tp":"💡 假設語氣全部用 were（不是 was）！與過去相反用 had + would have！"}};

function toggleEdit(){edM=!edM;document.body.classList.toggle('edit-mode',edM);const btn=document.querySelector('.edit-toggle');if(btn){btn.classList.toggle('active',edM);btn.textContent=edM?'🔒 關閉編輯':'✏️ 編輯';}if(edM){document.querySelectorAll('.ki-b,.ki-tp,.cb').forEach(el=>{el.contentEditable='true';el.addEventListener('blur',svEd);});}else{document.querySelectorAll('[contenteditable]').forEach(el=>{el.contentEditable='false';});svEd();}}
const gearBtn=document.getElementById('gearBtn');updGear();
function svEd(){const r=F[ci];if(!r)return;const bs=document.querySelectorAll('.ki-b');const tp=document.querySelector('.ki-tp');let d=(md==='en')?EK[r.dim]:KD[r.dim];if(!d)d=(md==='en')?KD[r.dim]:EK[r.dim];if(!d)return;if(bs[0]){const t=bs[0].innerText.replace(/^🇹🇼 中文大腦怎麼想\n?/,'');d.cn=t;}if(bs[1]){const t=bs[1].innerText.replace(/^🇯🇵 日文大腦怎麼想\n?/,'').replace(/^🇺🇸 英文大腦怎麼想\n?/,'');d.br=t;}if(tp)d.tp=tp.innerText;const cb=document.querySelector('.cb');if(cb&&r.ct){cb.innerText.split('\n').filter(l=>l.trim()).forEach(l=>{if(l.includes('中文陷阱：'))r.ct.cn_blindspot=l.replace(/.*中文陷阱：\s*/,'');if(l.includes('日文邏輯：'))r.ct.jp_insight=l.replace(/.*日文邏輯：\s*/,'');if(l.includes('英文邏輯：'))r.ct.en_insight=l.replace(/.*英文邏輯：\s*/,'');});}const fl=document.createElement('div');fl.className='edit-saved';fl.textContent='✅ 已儲存';document.body.appendChild(fl);setTimeout(()=>fl.remove(),1500);}
window.exportEdits=function(){const d={KD,EK,rules:R.map(r=>({id:r.id,dim:r.dim,cn:r.cn,ct:r.ct}))};const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='trilingual-edits-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(u);};
