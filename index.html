:"🦊","t":"Iggy","mt":"🎨 形容的話放東西前面！","cn":"中文：紅色的花、跑步的男孩。","br":"日文也放前面！「昨天在學校教我數學的老師」整串都塞在「先生」前面！","tp":"💡 日文跟中文一樣：形容的話放前面！","th":"jp"},"推測 でしょう":{"m":"🦊","t":"Iggy","mt":"🤔 「大概吧」的魔法尾巴！","cn":"中文說「大概」「可能」就好。","br":"日文在句尾加「でしょう」就變猜測語氣！像加了「大概吧」的尾巴。","tp":"💡 でしょう=大概吧、應該吧！","th":"jp"},"ように 目標":{"m":"🦊","t":"Iggy","mt":"🎯 為了變成那個樣子！","cn":"中文說「為了」就好。","br":"ように像瞄準目標！「上手になるように」=為了變厲害。先看目標再拉弓！","tp":"💡 ように=為了變成那個樣子！","th":"jp"},"のに 轉折":{"m":"🦊","t":"Iggy","mt":"😤 明明就…結果卻…！","cn":"中文「明明…卻…」","br":"のに就是不爽！勉強したのに落ちた=明明讀了卻沒過。充滿「好氣」的感覺！","tp":"💡 のに=明明就…結果卻…（好氣）！","th":"jp"},"ので 原因":{"m":"🦊","t":"Iggy","mt":"📋 客氣地說理由！","cn":"中文「因為…所以…」","br":"ので是很客氣地說理由！比「から」有禮貌，跟老師說話用ので比較好！","tp":"💡 ので=有禮貌地說「因為」！","th":"jp"},"ほど 程度":{"m":"🦊","t":"Iggy","mt":"📏 誇張到什麼程度！","cn":"中文「辣到哭」「累死了」","br":"ほど=到了…的程度！泣くほど辛い=辣到會哭。像放大鏡把誇張放更大！","tp":"💡 ほど=到了…的程度！","th":"jp"},"使役形":{"m":"🦊","t":"Iggy","mt":"👆 叫別人去做的命令貼紙！","cn":"中文說「叫他去」「讓他做」就好。","br":"日文的動作可以貼上「させる」的命令貼紙！食べる→食べさせる=叫別人吃。像是幫動作加了一個「你去做」的命令！","tp":"💡 させる=叫別人去做！","th":"jp"},"ために 目的":{"m":"🦊","t":"Iggy","mt":"🎯 就是為了這個目的！","cn":"中文「為了」就好。","br":"ために比ように更直接！大学に入るために勉強する。目標明確決心堅定！","tp":"💡 ために=就是為了這個目的！","th":"jp"},"工具箱 で":{"m":"🦊","t":"Iggy","mt":"🔧 用什麼工具、在哪裡做！","cn":"中文靠前後文。","br":"で像工具箱！箸で食べる=用筷子吃。公園で遊ぶ=在公園玩。一個で兩種用法！","tp":"💡 で=用什麼工具 或 在哪裡！","th":"jp"},"使役 させる":{"m":"🦊","t":"Iggy","mt":"👆 叫別人去做的命令貼紙！","cn":"中文說「叫他去」「讓他做」就好。","br":"日文的動作可以貼上「させる」的命令貼紙！食べる→食べさせる=叫別人吃。像是幫動作加了一個「你去做」的命令！","tp":"💡 させる=叫別人去做！","th":"jp"},"〜きらいがある":{"m":"🦊","t":"Iggy","mt":"😬 壞習慣偵測器！","cn":"中文說「他總是…」「他有…的傾向」。","br":"「きらいがある」是壞習慣偵測器！先延ばしにするきらいがある=有拖延的壞習慣。通常用來說別人的缺點！","tp":"💡 きらいがある=有…的壞習慣！","th":"jp"},"〜ずくめ":{"m":"🦊","t":"Iggy","mt":"🎨 全部都是同一色！","cn":"中文說「全是…」「盡是…」。","br":"「ずくめ」就是從頭到尾都是同一種東西！黒ずくめ=全身黑。いいことずくめ=全都是好事。","tp":"💡 ずくめ=從頭到尾全是！","th":"jp"},"〜を限りに":{"m":"🦊","t":"Iggy","mt":"✂️ 在這裡剪斷！","cn":"中文說「以…為限」「到…為止」。","br":"「を限りに」像一把剪刀！今日を限りに=以今天為界線，剪斷！之後就不再做了。","tp":"💡 を限りに=到此為止，剪斷！","th":"jp"},"〜に即して":{"m":"🦊","t":"Iggy","mt":"📏 貼著尺走！","cn":"中文說「根據…」「按照…」。","br":"「に即して」就是緊緊貼著規則走！現実に即して=貼著現實走，不能天馬行空。","tp":"💡 に即して=緊貼著…來做！","th":"jp"},"〜ともなると":{"m":"🦊","t":"Iggy","mt":"👑 到了那個等級就不一樣！","cn":"中文說「一旦到了…的程度」。","br":"「ともなると」是等級提升！社長ともなると=一旦當上社長。到了那個等級，事情就完全不一樣了。","tp":"💡 ともなると=到了那個等級就不同！","th":"jp"},"〜まじき":{"m":"🦊","t":"Iggy","mt":"🚫 不配這個身分！","cn":"中文說「不該有的」「不配的」。","br":"「まじき」是嚴厲的批評！教師にあるまじき行為=身為老師不該有的行為。帶著很失望的語氣。","tp":"💡 まじき=不配這個身分的行為！","th":"jp"},"〜ずにはいられない":{"m":"🦊","t":"Iggy","mt":"🌊 忍不住的衝動！","cn":"中文說「忍不住…」「不得不…」。","br":"「ずにはいられない」就是怎麼忍都忍不住！泣かずにはいられない=忍不住想哭。完全擋不住的感覺！","tp":"💡 ずにはいられない=忍不住！","th":"jp"},"〜ざるを得ない":{"m":"🦊","t":"Iggy","mt":"😩 不想做但不得不做！","cn":"中文說「不得不…」「只好…」。","br":"「ざるを得ない」是心不甘情不願但沒辦法！出席せざるを得ない=不得不出席。充滿無奈的感覺！","tp":"💡 ざるを得ない=不想但不得不！","th":"jp"},"〜にかたくない":{"m":"🦊","t":"Iggy","mt":"🤔 不難想像！","cn":"中文說「不難想像」「可以理解」。","br":"「にかたくない」=一點都不難想像！想像にかたくない=不難想像。書面語比較常用！","tp":"💡 にかたくない=不難想像！","th":"jp"},"〜べく":{"m":"🦊","t":"Iggy","mt":"🎯 為了達成而努力！","cn":"中文說「為了…」。","br":"「べく」是很文雅的「為了」！夢を実現すべく=為了實現夢想。像騎士為了完成使命而出發！","tp":"💡 べく=為了…（很有決心）！","th":"jp"},"〜かたわら":{"m":"🦊","t":"Iggy","mt":"🤹 一邊做A一邊做B！","cn":"中文說「一邊…一邊…」。","br":"「かたわら」是同時做兩件正經事！教師をするかたわら小説を書く=一邊當老師一邊寫小說。","tp":"💡 かたわら=認真地一邊…一邊…！","th":"jp"},"〜なり":{"m":"🦊","t":"Iggy","mt":"⚡ 一…馬上就…！","cn":"中文說「一…就…」。","br":"「なり」是超級快！帰宅するなり寝た=一回到家馬上就睡了。比「たら」更快更突然。","tp":"💡 なり=一做完馬上就！","th":"jp"},"〜そばから":{"m":"🦊","t":"Iggy","mt":"🔄 做了馬上又沒了！","cn":"中文說「才剛…就…」。","br":"「そばから」是白做工的感覺！覚えたそばから忘れる=才剛記住馬上就忘。一直重複白忙！","tp":"💡 そばから=才剛做完就白費了！","th":"jp"},"〜ものを":{"m":"🦊","t":"Iggy","mt":"😤 明明可以的偏偏不…！","cn":"中文說「明明…卻偏偏…」。","br":"「ものを」充滿遺憾！聞けば教えたものを=你問的話我就教你了，偏偏你不問！","tp":"💡 ものを=明明可以卻偏不！（好可惜）","th":"jp"},"〜といえども":{"m":"🦊","t":"Iggy","mt":"👑 即使是國王也…！","cn":"中文說「即使…也…」。","br":"「といえども」是「就算你很厲害也一樣」！専門家といえども間違う=即使是專家也會犯錯。","tp":"💡 といえども=就算是…也一樣！","th":"jp"},"〜なりに":{"m":"🦊","t":"Iggy","mt":"💪 用自己的方式！","cn":"中文說「以自己的方式」。","br":"「なりに」是肯定每個人有自己的做法！子供なりに考える=用小孩自己的方式思考。帶著溫暖的包容感！","tp":"💡 なりに=用自己的方式努力！","th":"jp"},"〜んがため":{"m":"🦊","t":"Iggy","mt":"⚔️ 為了…拼了！","cn":"中文說「為了…」（非常正式）。","br":"「んがため」是超級正式的「為了」！像古代武士出征前說的話，非常有氣勢和決心。","tp":"💡 んがため=為了…拼了！（超正式）","th":"jp"},"〜に至るまで":{"m":"🦊","t":"Iggy","mt":"📏 從頭到尾都包！","cn":"中文說「從…到…」「甚至連…都…」。","br":"「に至るまで」是範圍超級廣！子供から大人に至るまで=從小孩到大人全都包。","tp":"💡 に至るまで=一路到…全包！","th":"jp"},"〜や否や":{"m":"🦊","t":"Iggy","mt":"⚡ 瞬間發生！","cn":"中文說「一…就立刻…」。","br":"「や否や」比「なり」更戲劇化！ベルが鳴るや否や飛び出した=鈴聲一響就飛出去了。","tp":"💡 や否や=一發生就立刻！（電影感）","th":"jp"},"〜つつ（も）":{"m":"🦊","t":"Iggy","mt":"😖 明知道不好還是做！","cn":"中文說「雖然知道…但還是…」。","br":"「つつも」是內心的矛盾！体に悪いと知りつつも吸う=知道不好還是抽菸。充滿「我也很無奈」的感覺。","tp":"💡 つつも=知道不好但還是…！","th":"jp"},"〜ものの":{"m":"🦊","t":"Iggy","mt":"🔄 雖然是這樣但是…","cn":"中文說「雖然…但是…」。","br":"「ものの」是期待落空！買ったものの使っていない=雖然買了但沒在用。帶著失望和反差的感覺。","tp":"💡 ものの=雖然…但結果卻…！","th":"jp"},"〜からこそ":{"m":"🦊","t":"Iggy","mt":"💎 正是因為…才…！","cn":"中文說「正是因為…所以才…」。","br":"「からこそ」是強調原因！愛しているからこそ厳しい=正是因為愛你才嚴格。強調最重要的原因！","tp":"💡 からこそ=正是因為…才！","th":"jp"},"〜にすぎない":{"m":"🦊","t":"Iggy","mt":"🤏 只不過是…而已！","cn":"中文說「只不過…而已」。","br":"「にすぎない」是把事情縮小！推測にすぎない=只不過是猜測而已。其實沒什麼了不起！","tp":"💡 にすぎない=只不過…而已！","th":"jp"},"〜にほかならない":{"m":"🦊","t":"Iggy","mt":"🎯 就是這個沒別的！","cn":"中文說「正是…」「不外乎就是…」。","br":"「にほかならない」是100%確定！努力の結果にほかならない=就是努力的結果，沒有別的解釋。","tp":"💡 にほかならない=就是這個沒錯！","th":"jp"},"〜をめぐって":{"m":"🦊","t":"Iggy","mt":"🔄 大家圍著這個話題吵！","cn":"中文說「圍繞著…」「關於…」。","br":"「をめぐって」像大家圍著桌子討論！環境問題をめぐって議論=圍繞著環境問題在討論。","tp":"💡 をめぐって=圍繞著…在爭論！","th":"jp"},"〜に相違ない":{"m":"🦊","t":"Iggy","mt":"💯 絕對沒錯！","cn":"中文說「一定是…」「毫無疑問…」。","br":"「に相違ない」是超級有自信！彼が犯人に相違ない=他一定是犯人。像法官做判決一樣嚴肅！","tp":"💡 に相違ない=絕對是…沒錯！","th":"jp"},"〜極まりない":{"m":"🦊","t":"Iggy","mt":"💥 到了極點！","cn":"中文說「…到了極點」「非常…」。","br":"「極まりない」是把形容詞開到最大！失礼極まりない=失禮到了極點。像音量旋鈕轉到爆表！","tp":"💡 極まりない=…到了極點！超級…！","th":"jp"},"〜を皮切りに":{"m":"🦊","t":"Iggy","mt":"🎬 從這裡開始連鎖反應！","cn":"中文說「以…為開端」。","br":"「を皮切りに」像推倒第一張骨牌！東京を皮切りに全国ツアー=以東京為起點展開全國巡迴。","tp":"💡 を皮切りに=從這裡開始連鎖！","th":"jp"},"〜べからず":{"m":"🦊","t":"Iggy","mt":"🚫 古代的禁止令！","cn":"中文說「不可以…」「禁止…」。","br":"「べからず」是很古老的禁止說法！ここに入るべからず=禁止進入。像古代城堡的警告牌！","tp":"💡 べからず=禁止！（古代感）","th":"jp"},"疑問句":{"m":"🦊","t":"Iggy","mt":"❓ 句尾加「か」就變問句！","cn":"中文在句尾加「嗎」就變問句。","br":"日文比英文簡單太多！不管什麼問句，只要在最後面加一個「か」就搞定了！これは本ですか＝這是書嗎？猫が好きですか＝喜歡貓嗎？不用像英文分 Do/Is，「か」一招通吃！","tp":"💡 日文的「か」＝萬能問號！什麼問句都加「か」！","th":"jp"},"形容詞述語":{"m":"🦊","t":"Iggy","mt":"🎨 形容詞會變身！","cn":"中文形容詞不會變：很冷、不冷，「冷」都長一樣。","br":"日文的形容詞會變身！寒い→寒くない→寒かった。尾巴會變來變去！分「い形容詞」和「な形容詞」兩家人。","tp":"💡 い形容詞和な形容詞的變身規則不同！","th":"jp"},"Present Simple":{"m":"🦊","t":"Iggy","mt":"📦 日文現在式和未來式長一樣！","cn":"中文的「吃」不管現在還是未來都一樣。","br":"日文也是！「食べます」可以是「現在吃」也可以是「以後會吃」。一個「ます」就搞定！","tp":"💡 ます=現在做 或 以後會做！","th":"jp"},"Articles":{"m":"🦊","t":"Iggy","mt":"🎉 日文不需要冠詞！","cn":"中文沒有 a/the 的概念。","br":"好消息！日文也沒有冠詞！不用像英文煩惱「要穿 a 還是 the」。日文說「猫」就是「猫」！","tp":"💡 日文跟中文一樣不用冠詞！","th":"jp"},"Can":{"m":"🦊","t":"Iggy","mt":"💪 動詞變身就變成「會」！","cn":"中文加「會」就好：我會游泳。","br":"日文的「會」要讓動詞變身！泳ぐ→泳げる=會游泳。動詞自己穿上「能力裝」就代表「會」了！","tp":"💡 日文動詞自己變身=我會！","th":"jp"},"Be Adj":{"m":"🦊","t":"Iggy","mt":"🎨 日文形容詞自己就能當結尾！","cn":"中文直接說「很大」，不用動詞。","br":"日文的形容詞也可以自己當句子結尾！大きいです=很大。日文的「です」只是讓語氣更禮貌！","tp":"💡 日文形容詞+です=完成！","th":"jp"},"This Is":{"m":"🦊","t":"Iggy","mt":"👉 これ/それ/あれ 三兄弟！","cn":"中文用「這」「那」兩個就夠了。","br":"日文有三兄弟！これ=在我手邊的，それ=在你旁邊的，あれ=離我們都遠的。比中文多一個！","tp":"💡 これ(我的)、それ(你的)、あれ(遠的)！","th":"jp"},"Question":{"m":"🦊","t":"Iggy","mt":"❓ 句尾加「か」就好！","cn":"中文加「嗎」就變問句。","br":"日文跟中文很像！只要在最後面加「か」就變問句。比英文簡單多了，不用分 Do 還是 Is！","tp":"💡 か＝日文版的「嗎」！","th":"jp"},"Want To":{"m":"🦊","t":"Iggy","mt":"🌟 動詞穿上「たい」的願望衣！","cn":"中文說「想要吃」就好。","br":"日文的「想要」是讓動詞穿上「たい」的願望衣服！食べる→食べたい=想吃。行く→行きたい=想去。","tp":"💡 動詞+たい=想要做！","th":"jp"},"There Is":{"m":"🦊","t":"Iggy","mt":"🐱 います vs あります 又來了！","cn":"中文不管什麼都說「有」。","br":"日文的「有」分兩種！猫がいます=有貓（會動的），本があります=有書（不會動的）。","tp":"💡 會動→います，不會動→あります！","th":"jp"},"Negative":{"m":"🦊","t":"Iggy","mt":"✋ 動詞脫掉「ます」換穿「ません」！","cn":"中文在前面加「不」就好。","br":"日文的否定是讓動詞換衣服！食べます→食べません。把「ます」脫掉，換穿「ません」的否定外套！","tp":"💡 ます→ません=不！","th":"jp"},"Imperative":{"m":"🦊","t":"Iggy","mt":"🙏 日文命令要看對象！","cn":"中文直接說「開門！」就好。","br":"日文命令要看關係！對朋友用「て形」：ドアを開けて。加「ください」更客氣：開けてください。","tp":"💡 て+ください=有禮貌地拜託！","th":"jp"},"Past Tense":{"m":"🦊","t":"Iggy","mt":"⏰ ます→ました 就回到過去！","cn":"中文加「了」就好。","br":"日文也是換衣服！食べます→食べました。比英文簡單，不會有 eat→ate 那種亂變身！","tp":"💡 ます→ました=過去的事！","th":"jp"},"Future Tense":{"m":"🦊","t":"Iggy","mt":"📦 日文不分現在和未來！","cn":"中文加「會」或「要」表示未來。","br":"日文的好消息！「食べます」可以是「現在吃」也可以是「以後吃」。不用另外請 will 幫忙！","tp":"💡 ます就包含了現在和未來！","th":"jp"},"Present Continuous":{"m":"🦊","t":"Iggy","mt":"⏳ ている 又出現了！","cn":"中文加「正在」就好。","br":"日文用「ている」表示正在做！食べている=正在吃。但ている是雙面魔法，也可以表示狀態！","tp":"💡 ている=正在做 或 一直是那樣！","th":"jp"},"Passive":{"m":"🦊","t":"Iggy","mt":"😱 受害者出來告狀！","cn":"中文加「被」就好。","br":"日文的被動帶著不爽的心情！ケーキは母に作られた=蛋糕是被媽媽做的。常帶「我好倒霉」的感覺！","tp":"💡 日文的「被」=被+不爽😤！","th":"jp"},"Comparative":{"m":"🦊","t":"Iggy","mt":"📏 日文用「より」來比較！","cn":"中文用「比」：她比我高。","br":"日文用「より」！彼女は私より背が高い=她比我高。比英文簡單，不用記 er 或 more！","tp":"💡 AはBより=A比B！","th":"jp"},"Relative":{"m":"🦊","t":"Iggy","mt":"🎨 形容的話全塞在前面！","cn":"中文跟日文一樣把形容的話放前面：「跑步的男孩」。","br":"日文的關係子句跟中文一樣放在前面！走っている男の子=正在跑步的男孩。但英文用 who 放後面。這一點日文跟中文是好朋友！","tp":"💡 日文跟中文一樣放前面，英文用 who 放後面！","th":"jp"},"Conditional":{"m":"🦊","t":"Iggy","mt":"🌧️ 「如果」有四件外套！","cn":"中文只有一種「如果」。","br":"日文的「如果」有四件外套！「たら」最萬用、「ば」正式、「と」自然規律、「なら」聽說的。","tp":"💡 不確定就穿「たら」最安全！","th":"jp"}};
